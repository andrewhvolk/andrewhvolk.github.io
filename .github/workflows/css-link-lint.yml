name: CSS Link Lint

on:
  pull_request:
  push:
    branches:
      - main

# Forces GitHub Actions to use Node.js 24 to resolve the deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  css-link-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run CSS link lint
        run: python scripts/check_css_links.py

      - name: Run local link check
        run: python scripts/check_links.py

      - name: Run HTML structure check
        run: python scripts/check_html_structure.py
