name: CSS Link Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  css-link-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run CSS link lint
        run: python scripts/check_css_links.py
