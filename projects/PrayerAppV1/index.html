<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Tracker</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Ensure dark mode is controlled by the class on <html>
            theme: {
                extend: {
                    // You can extend the theme here if needed
                }
            }
        }
    </script>
    <!-- Import the Alpine component logic -->
    <script type="module">
        import prayerApp from './js/alpineComponent.js';
        // Make the component available globally for Alpine
        window.prayerApp = prayerApp;
    </script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <style>
        /* Basic scrollbar styling for dark mode */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; } /* gray-800 */
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; } /* gray-600 */
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; } /* gray-500 */
        [x-cloak] { display: none !important; } /* Hide elements until Alpine initializes */
    </style>
</head>
<body class="bg-gray-900 text-gray-200 antialiased min-h-screen">
    <!-- Standalone decision: keep this app independent from the site shell because it behaves like a focused single-page utility with its own full-screen UI. Avoid mixing in partial shared-shell markup that would imply a standard content page. -->


    <div class="container mx-auto max-w-3xl p-4 md:p-8"
         x-data="prayerApp()"
         x-init="init()"
         x-cloak>

        <h1 class="text-3xl font-bold text-center text-blue-400 mb-8">Prayer Tracker</h1>
        <!-- Import/Export Buttons -->
        <div class="flex justify-center space-x-4 mb-6">
            <button @click="exportPrayers()"
                    class="px-3 py-1 rounded bg-green-600 hover:bg-green-700 text-white text-sm font-medium shadow transition duration-150 ease-in-out">
                Export Prayers
            </button>
            <button @click="importPrayers()"
                    class="px-3 py-1 rounded bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium shadow transition duration-150 ease-in-out">
                Import Prayers
            </button>
        </div>


        <!-- Add Prayer Form -->
        <form @submit.prevent="addPrayer()" class="mb-8 p-6 bg-gray-800 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-100">Add New Prayer Request</h2>
            <div class="mb-4">
                <label for="newTitle" class="block text-sm font-medium text-gray-300 mb-1">Title <span class="text-red-500">*</span></label>
                <input type="text" id="newTitle" x-model="newPrayerTitle" placeholder="e.g., Guidance for project" required
                       class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div class="mb-4">
                <label for="newDescription" class="block text-sm font-medium text-gray-300 mb-1">Description (Optional)</label>
                <textarea id="newDescription" x-model="newPrayerDescription" rows="3" placeholder="Add any details or notes here..."
                          class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>
            <button type="submit"
                    class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md shadow transition duration-150 ease-in-out">
                Add Prayer
            </button>
        </form>

        <!-- View Tabs -->
        <div class="mb-6 flex justify-center space-x-4 border-b border-gray-700 pb-2">
            <button @click="setView('all')"
                    :class="{ 'bg-gray-700 text-blue-400': isViewActive('all'), 'text-gray-400 hover:text-gray-200': !isViewActive('all') }"
                    class="px-4 py-2 rounded-t-md font-medium transition duration-150 ease-in-out">
                All (<span x-text="prayers.length"></span>)
            </button>
            <button @click="setView('unanswered')"
                    :class="{ 'bg-gray-700 text-blue-400': isViewActive('unanswered'), 'text-gray-400 hover:text-gray-200': !isViewActive('unanswered') }"
                    class="px-4 py-2 rounded-t-md font-medium transition duration-150 ease-in-out">
                Unanswered (<span x-text="prayers.filter(p => !p.isAnswered).length"></span>)
            </button>
            <button @click="setView('answered')"
                    :class="{ 'bg-gray-700 text-blue-400': isViewActive('answered'), 'text-gray-400 hover:text-gray-200': !isViewActive('answered') }"
                    class="px-4 py-2 rounded-t-md font-medium transition duration-150 ease-in-out">
                Answered (<span x-text="prayers.filter(p => p.isAnswered).length"></span>)
            </button>
        </div>

        <!-- Prayer List -->
        <div class="space-y-4">
            <template x-if="filteredPrayers.length === 0">
                <p class="text-center text-gray-500 italic py-4" x-text="currentView === 'all' ? 'No prayers added yet.' : (currentView === 'answered' ? 'No answered prayers.' : 'No unanswered prayers.')"></p>
            </template>

            <template x-for="prayer in filteredPrayers" :key="prayer.id">
                <div class="p-4 bg-gray-800 rounded-lg shadow-md border border-gray-700 transition duration-300 ease-in-out hover:border-gray-600">
                    <!-- Edit View -->
                    <template x-if="editingPrayer && editingPrayer.id === prayer.id">
                        <div class="edit-form">
                            <h3 class="text-lg font-semibold mb-3 text-gray-100">Edit Prayer</h3>
                            <div class="mb-3">
                                <label :for="'editTitle-' + prayer.id" class="block text-sm font-medium text-gray-300 mb-1">Title <span class="text-red-500">*</span></label>
                                <input type="text" :id="'editTitle-' + prayer.id" x-model="editTitle" required
                                       class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div class="mb-3">
                                <label :for="'editDesc-' + prayer.id" class="block text-sm font-medium text-gray-300 mb-1">Description</label>
                                <textarea :id="'editDesc-' + prayer.id" x-model="editDescription" rows="3"
                                          class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                            </div>
                            <div class="flex justify-end space-x-2">
                                <button @click="cancelEdit()" class="px-3 py-1 bg-gray-600 hover:bg-gray-500 text-white text-sm font-medium rounded-md shadow transition duration-150 ease-in-out">Cancel</button>
                                <button @click="saveEdit()" class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-md shadow transition duration-150 ease-in-out">Save Changes</button>
                            </div>
                        </div>
                    </template>

                    <!-- Display View -->
                    <template x-if="!editingPrayer || editingPrayer.id !== prayer.id">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-semibold text-gray-100 break-words mr-2" x-text="prayer.title"></h3>
                                <div class="flex-shrink-0 flex items-center space-x-2">
                                    <button @click="toggleAnswered(prayer.id)"
                                            :class="prayer.isAnswered ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-green-600 hover:bg-green-700'"
                                            class="px-2 py-1 text-xs font-medium text-white rounded-md shadow transition duration-150 ease-in-out"
                                            :title="prayer.isAnswered ? 'Mark as Unanswered' : 'Mark as Answered'">
                                        <span x-text="prayer.isAnswered ? 'Unmark' : 'Answered?'"></span>
                                    </button>
                                    <button @click="logPrayerPrayed(prayer.id)"
                                            x-show="!prayer.isAnswered"
                                            title="Log Prayed For"
                                            class="px-2 py-1 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-md shadow transition duration-150 ease-in-out">
                                        Prayed For
                                    </button>
                                    <button @click="startEditing(prayer)" title="Edit Prayer" class="text-gray-400 hover:text-blue-400 transition duration-150 ease-in-out">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                                    </button>
                                    <button @click="deletePrayer(prayer.id)" title="Delete Prayer" class="text-gray-400 hover:text-red-500 transition duration-150 ease-in-out">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                                    </button>
                                </div>
                            </div>

                            <p class="text-gray-400 text-sm mb-3 whitespace-pre-wrap break-words" x-show="prayer.description" x-text="prayer.description"></p>

                            <div class="text-xs text-gray-500 flex justify-between items-center">
                                <span>Added: <span x-text="formatDate(prayer.dateAdded)"></span></span>
                                <span x-show="prayer.isAnswered" class="text-green-400 font-medium">
                                    Answered: <span x-text="formatDate(prayer.dateAnswered)"></span>
                                </span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Bulk Delete Button -->
        <div class="mt-8 text-center" x-show="prayers.some(p => p.isAnswered)">
             <button @click="deleteAllAnswered()"
                    class="px-4 py-2 bg-red-700 hover:bg-red-800 text-white text-sm font-medium rounded-md shadow transition duration-150 ease-in-out">
                Delete All Answered Prayers
            </button>
        </div>

    </div>


</body>
</html>
