<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Column Resonance Lab</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Inline SVG Icons (Replacing lucide-react dependencies) ---
        const Play = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const Calculator = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>;
        const Thermometer = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>;
        const CheckCircle2 = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="m9 12 2 2 4-4"></path></svg>;
        const Printer = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
        const Volume2 = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
        const ArrowUpDown = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21 16-4 4-4-4"></path><path d="M17 20V4"></path><path d="m3 8 4-4 4 4"></path><path d="M7 4v16"></path></svg>;
        const BookOpen = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const Camera = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>;
        const FileText = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>;
        const Info = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

        function App() {
          // UI State
          const [activeTab, setActiveTab] = useState('theory'); // 'simulation' or 'theory'
          
          // Physics State
          const [temp, setTemp] = useState(20);
          const [tubeLength, setTubeLength] = useState(2.0);
          const [isPlaying, setIsPlaying] = useState(false);
          
          // Lab Notebook State
          const [studentName, setStudentName] = useState('');
          const [studentDate, setStudentDate] = useState(new Date().toLocaleDateString());
          const [snapshot, setSnapshot] = useState(null);
          
          const [theoV, setTheoV] = useState('');
          const [theoWork, setTheoWork] = useState('');
          
          const [tableData, setTableData] = useState([
            { L: '', lambda: '', v: '', error: '' },
            { L: '', lambda: '', v: '', error: '' },
            { L: '', lambda: '', v: '', error: '' },
          ]);
          const [expWork, setExpWork] = useState('');
          const [diffWork, setDiffWork] = useState('');
          
          const [feedback, setFeedback] = useState({});

          // Audio Refs
          const audioCtx = useRef(null);
          const oscillator = useRef(null);
          const resNode = useRef(null);
          const playTimeout = useRef(null);

          // Physics calculation for resonance gain mapping
          const calculateResonance = (lengthCm, tempC) => {
            const v = 331.4 + 0.6 * tempC;
            const lambda = v / 2048; // using 2048 Hz fork
            const L_m = lengthCm / 100;
            
            // Theoretical resonance points (L1, L2, L3)
            const res1 = lambda / 4;
            const res2 = 3 * lambda / 4;
            const res3 = 5 * lambda / 4;

            // Find distance to closest resonance point
            const dist = Math.min(Math.abs(L_m - res1), Math.abs(L_m - res2), Math.abs(L_m - res3));
            
            // Create a sharp gaussian peak for the resonance effect
            const boost = Math.exp(-Math.pow(dist / 0.004, 2)); 
            return 0.01 + 0.29 * boost; 
          };

          const playFork = () => {
            if (!audioCtx.current) {
              audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
            }
            const ctx = audioCtx.current;

            if (oscillator.current) {
              oscillator.current.stop();
              oscillator.current.disconnect();
            }

            const osc = ctx.createOscillator();
            const mainGain = ctx.createGain();
            const resGain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.value = 2048;

            osc.connect(resGain);
            resGain.connect(mainGain);
            mainGain.connect(ctx.destination);

            resGain.gain.value = calculateResonance(tubeLength, temp);

            mainGain.gain.setValueAtTime(0, ctx.currentTime);
            mainGain.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.05);
            mainGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 10);

            osc.start();
            oscillator.current = osc;
            resNode.current = resGain;
            setIsPlaying(true);

            if (playTimeout.current) clearTimeout(playTimeout.current);
            playTimeout.current = setTimeout(() => {
              setIsPlaying(false);
              osc.stop();
            }, 10000);
          };

          useEffect(() => {
            if (resNode.current && audioCtx.current && isPlaying) {
              const val = calculateResonance(tubeLength, temp);
              resNode.current.gain.setTargetAtTime(val, audioCtx.current.currentTime, 0.05);
            }
          }, [tubeLength, temp, isPlaying]);

          useEffect(() => {
            return () => {
              if (oscillator.current) oscillator.current.stop();
              if (audioCtx.current) audioCtx.current.close();
            };
          }, []);

          const takeSnapshot = () => {
            setSnapshot({
              tubeLength,
              temp,
              studentName: studentName || 'Student',
              date: studentDate,
              timestamp: new Date().toLocaleTimeString()
            });
          };

          const updateTable = (index, field, value) => {
            const newData = [...tableData];
            newData[index][field] = value;
            setTableData(newData);
            setFeedback(prev => ({ ...prev, [`${field}_${index}`]: null }));
          };

          const verifyMath = () => {
            const expectedTheoV = 331.4 + 0.6 * temp;
            const theoCorrect = Math.abs(parseFloat(theoV) - expectedTheoV) < 0.5;
            
            const newFeedback = { theoV: theoCorrect };

            tableData.forEach((row, index) => {
              const L = parseFloat(row.L);
              const lambda = parseFloat(row.lambda);
              const v = parseFloat(row.v);
              const err = parseFloat(row.error);

              if (isNaN(L)) return;

              let expectedLambda = 0;
              if (index === 0) expectedLambda = 4 * L;
              if (index === 1) expectedLambda = (4 * L) / 3;
              if (index === 2) expectedLambda = (4 * L) / 5;

              const expectedV = 2048 * expectedLambda;
              
              // Using the exact % difference formula from the PDF (using average in denominator)
              const expectedErr = Math.abs((expectedV - expectedTheoV) / ((expectedV + expectedTheoV) / 2)) * 100;

              if (!isNaN(lambda)) newFeedback[`lambda_${index}`] = Math.abs(lambda - expectedLambda) < 0.05;
              if (!isNaN(v)) newFeedback[`v_${index}`] = Math.abs(v - expectedV) < 2.0;
              if (!isNaN(err)) newFeedback[`err_${index}`] = Math.abs(err - expectedErr) < 1.0;
            });

            setFeedback(newFeedback);
          };

          // SVG Drawing logic abstracted for reuse in snapshot
          const renderSVG = (simLength, simTemp, animate) => {
            const scale = 8;
            const topY = 250 - simLength * scale;
            const L_px = simLength * scale;
            
            const lambda_cm = ((331.4 + 0.6 * simTemp) / 2048) * 100;
            const k = (2 * Math.PI) / (lambda_cm * scale);
            const visualBoost = (calculateResonance(simLength, simTemp) - 0.01) / 0.29; 
            
            let wavePath = null;
            if ((animate && isPlaying) || (!animate && visualBoost > 0.05)) {
              const amp = 20 * visualBoost;
              let path = `M 100 ${topY}`;
              for (let y = 0; y < L_px; y += 2) path += ` L ${100 + amp * Math.sin(k * (L_px - y))} ${topY + y}`;
              path += ` L 100 ${topY + L_px}`;
              for (let y = L_px; y > 0; y -= 2) path += ` L ${100 - amp * Math.sin(k * (L_px - y))} ${topY + y}`;
              path += ' Z';
              wavePath = <path d={path} fill="#93c5fd" opacity={0.3 + 0.5 * visualBoost} stroke="#3b82f6" strokeWidth="1.5" />;
            }

            return (
              <svg viewBox="0 0 200 400" className="w-full h-full max-w-sm">
                <rect x="0" y="0" width="200" height="400" fill="#f8fafc" />
                <path d="M 0 50 L 200 50 M 0 100 L 200 100 M 0 150 L 200 150 M 0 200 L 200 200 M 0 250 L 200 250 M 0 300 L 200 300 M 0 350 L 200 350" stroke="#e2e8f0" strokeWidth="1" />
                
                {/* Cylinder & Water */}
                <rect x="60" y="100" width="80" height="280" fill="#ffffff" stroke="#cbd5e1" strokeWidth="3" rx="8" />
                <path d="M 50 380 L 150 380 L 160 395 L 40 395 Z" fill="#cbd5e1" />
                <rect x="61.5" y="250" width="77" height="128.5" fill="#bae6fd" opacity="0.6" rx="4" />
                <line x1="61.5" y1="250" x2="138.5" y2="250" stroke="#38bdf8" strokeWidth="2" />
                
                {/* Inner Tube */}
                <rect x="75" y={topY} width="50" height="300" fill="#ffffff" fillOpacity="0.4" stroke="#475569" strokeWidth="2" />
                {Array.from({ length: 26 }).map((_, i) => (
                  <line key={`tick-${i}`} x1="75" y1={topY + i * scale} x2={i % 5 === 0 ? "85" : "80"} y2={topY + i * scale} stroke="#475569" strokeWidth={i % 5 === 0 ? "1.5" : "1"} />
                ))}

                {wavePath}

                {/* Labels & Fork */}
                <line x1="125" y1={topY} x2="145" y2={topY} stroke="#ef4444" strokeWidth="2" strokeDasharray="2 2" />
                <text x="148" y={topY + 4} fontSize="12" fill="#ef4444" fontWeight="bold" className="font-mono">{simLength.toFixed(1)}cm</text>
                
                <g transform={`translate(0, ${topY - 45})`}>
                  {/* Handle */}
                  <line x1="100" y1="-5" x2="100" y2="3" stroke="#64748b" strokeWidth="5" strokeLinecap="round" />
                  {/* Prongs (facing down towards the tube) */}
                  <path d="M 88 35 L 88 15 A 12 12 0 0 1 112 15 L 112 35" fill="none" stroke="#64748b" strokeWidth="5" strokeLinecap="round" />
                  {animate && isPlaying && (
                    <g className="animate-pulse" opacity="0.8">
                      {/* Left prong vibration */}
                      <path d="M 84 15 Q 74 25 84 35" fill="none" stroke="#3b82f6" strokeWidth="2" />
                      <path d="M 80 13 Q 66 25 80 37" fill="none" stroke="#3b82f6" strokeWidth="2" opacity="0.5" />
                      {/* Right prong vibration */}
                      <path d="M 116 15 Q 126 25 116 35" fill="none" stroke="#3b82f6" strokeWidth="2" />
                      <path d="M 120 13 Q 134 25 120 37" fill="none" stroke="#3b82f6" strokeWidth="2" opacity="0.5" />
                    </g>
                  )}
                </g>
              </svg>
            );
          };

          const getBorderColor = (status) => {
            if (status === true) return "border-green-500 focus:ring-green-500 bg-green-50/30";
            if (status === false) return "border-red-500 focus:ring-red-500 bg-red-50/30";
            return "border-slate-300 focus:ring-blue-500";
          };

          return (
            <div className="min-h-screen bg-slate-100 p-4 md:p-8 font-sans text-slate-800">
              <div className="max-w-7xl mx-auto space-y-6">
                
                {/* Header */}
                <header className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 rounded-xl shadow-sm gap-4">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-bold text-slate-800">Sound and Resonance</h1>
                    <p className="text-slate-500 mt-1">Virtual Lab Simulation & Digital Report</p>
                  </div>
                  <div className="flex gap-2 print:hidden">
                    <button 
                      onClick={() => setActiveTab('theory')}
                      className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors font-medium ${activeTab === 'theory' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                    >
                      <BookOpen size={18} /> Theory & Background
                    </button>
                    <button 
                      onClick={() => setActiveTab('simulation')}
                      className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors font-medium ${activeTab === 'simulation' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                    >
                      <FileText size={18} /> Simulation & Report
                    </button>
                    <button 
                      onClick={() => window.print()} 
                      className="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg transition-colors font-medium ml-2"
                    >
                      <Printer size={18} /> Print Report
                    </button>
                  </div>
                </header>

                {/* THEORY & BACKGROUND TAB */}
                {activeTab === 'theory' && (
                  <div className="bg-white p-8 rounded-xl shadow-sm space-y-8 text-slate-700 leading-relaxed max-w-4xl mx-auto print:block">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-800 border-b pb-2 mb-4">Background & Theory</h2>
                      <p className="mb-4">
                        Waves can transmit energy over a great distance. A wave is a propagation of energy due to a rhythmic disturbance in a medium or through space. Mechanical waves, such as sound, can only travel through a medium composed of some form of matter (gas, liquid, or solid).
                      </p>
                      <p>
                        Sound travels in a <strong>longitudinal wave</strong> (compression wave). The air molecules move together in regions called <em>compressions</em>, and spread apart in regions called <em>rarefactions</em>. The molecules vibrate parallel to the direction of the wave, remaining in the same general location while the energy travels outward.
                      </p>
                    </div>

                    <div className="grid md:grid-cols-2 gap-8">
                      <div className="bg-slate-50 p-6 rounded-lg border border-slate-100">
                        <h3 className="text-lg font-bold text-slate-800 mb-3">Wave Properties</h3>
                        <ul className="list-disc pl-5 space-y-2">
                          <li><strong>Amplitude (A):</strong> Distance from rest position to greatest displacement. Relates to intensity (loudness).</li>
                          <li><strong>Wavelength (λ):</strong> Distance between two identical points on a waveform (e.g., crest to crest).</li>
                          <li><strong>Frequency (f):</strong> Rate at which particles vibrate, measured in Hertz (Hz). The tuning fork in this kit is 2048 Hz.</li>
                          <li><strong>Velocity (v):</strong> Speed of the wave. Determined by the medium.<br/>
                          <span className="inline-block mt-2 font-mono bg-blue-100 text-blue-800 px-2 py-1 rounded">v = f × λ</span></li>
                        </ul>
                      </div>
                      
                      <div className="bg-slate-50 p-6 rounded-lg border border-slate-100">
                        <h3 className="text-lg font-bold text-slate-800 mb-3">Standing Waves & Resonance</h3>
                        <p className="text-sm mb-3">
                          At certain frequencies, waves reflecting off the end of a tube interfere with waves from the source to create a pattern that appears to stand still. 
                        </p>
                        <ul className="list-disc pl-5 space-y-2 text-sm">
                          <li><strong>Nodes:</strong> Points of no displacement. (Occurs at the closed end of our tube / water surface).</li>
                          <li><strong>Antinodes:</strong> Points of maximum displacement. (Occurs at the open end of our tube).</li>
                          <li>Resonance amplifies the sound when the tube length exactly matches an odd multiple of λ/4.</li>
                        </ul>
                      </div>
                    </div>

                    <div>
                      <h3 className="text-xl font-bold text-slate-800 mb-4">Harmonics for a Tube Closed at One End</h3>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                        <div className="border rounded-lg p-4 bg-blue-50/50">
                          <div className="font-bold text-blue-800 mb-2">Fundamental (1st Harmonic)</div>
                          <div className="font-mono text-lg mb-1">L = λ / 4</div>
                          <div className="font-mono text-sm text-slate-500">λ = 4L</div>
                        </div>
                        <div className="border rounded-lg p-4 bg-blue-50/50">
                          <div className="font-bold text-blue-800 mb-2">1st Overtone (3rd Harmonic)</div>
                          <div className="font-mono text-lg mb-1">L = 3λ / 4</div>
                          <div className="font-mono text-sm text-slate-500">λ = 4L / 3</div>
                        </div>
                        <div className="border rounded-lg p-4 bg-blue-50/50">
                          <div className="font-bold text-blue-800 mb-2">2nd Overtone (5th Harmonic)</div>
                          <div className="font-mono text-lg mb-1">L = 5λ / 4</div>
                          <div className="font-mono text-sm text-slate-500">λ = 4L / 5</div>
                        </div>
                      </div>
                    </div>

                    {/* Navigation Button */}
                    <div className="mt-8 pt-6 border-t border-slate-200 flex justify-end print:hidden">
                      <button 
                        onClick={() => setActiveTab('simulation')}
                        className="flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-sm"
                      >
                        Next: Complete the Lab <FileText size={18} />
                      </button>
                    </div>

                  </div>
                )}

                {/* SIMULATION & REPORT TAB */}
                <div className={`grid grid-cols-1 lg:grid-cols-12 gap-6 ${activeTab !== 'simulation' ? 'hidden print:grid' : ''}`}>
                  
                  {/* LEFT: SIMULATION PANEL (Hidden on print) */}
                  <div className="lg:col-span-4 space-y-6 print:hidden">
                    <div className="bg-white p-6 rounded-xl shadow-sm flex flex-col items-center">
                      <div className="w-full flex justify-between items-center mb-6 gap-2">
                        <div>
                          <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide flex items-center gap-1">
                            <Thermometer size={14}/> Room Temp
                          </label>
                          <div className="flex items-center gap-2 mt-1">
                            <input 
                              type="range" min="15" max="30" step="0.5" 
                              value={temp} onChange={e => setTemp(parseFloat(e.target.value))}
                              className="w-20 accent-rose-500"
                            />
                            <span className="font-mono font-medium">{temp.toFixed(1)}°C</span>
                          </div>
                        </div>
                        
                        <button 
                          onClick={playFork}
                          className={`flex items-center gap-2 px-4 py-2 rounded-lg text-white font-medium transition-all ${isPlaying ? 'bg-blue-400 animate-pulse' : 'bg-blue-600 hover:bg-blue-700 shadow-sm'}`}
                        >
                          {isPlaying ? <Volume2 size={16} /> : <Play size={16} />}
                          {isPlaying ? 'Ringing...' : 'Strike Fork'}
                        </button>
                      </div>

                      {/* SVG Visualizer */}
                      <div className="relative w-full aspect-[3/4] max-h-[400px] bg-white border border-slate-200 rounded-xl overflow-hidden shadow-inner flex justify-center items-center">
                        {renderSVG(tubeLength, temp, true)}
                      </div>

                      {/* Slider Control */}
                      <div className="w-full mt-6">
                        <label className="flex justify-between text-sm font-semibold text-slate-700 mb-2">
                          <span className="flex items-center gap-2"><ArrowUpDown size={16}/> Air Column Length (L)</span>
                          <span className="text-blue-600 font-mono">{tubeLength.toFixed(1)} cm</span>
                        </label>
                        <input 
                          type="range" min="0" max="25" step="0.1" 
                          value={tubeLength} 
                          onChange={e => setTubeLength(parseFloat(e.target.value))}
                          className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                        />
                      </div>

                      {/* Snapshot Button */}
                      <button 
                        onClick={takeSnapshot}
                        className="w-full mt-6 flex justify-center items-center gap-2 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition-colors border border-slate-300"
                      >
                        <Camera size={18} /> Capture Setup Snapshot
                      </button>
                    </div>

                    <div className="bg-amber-50 p-5 rounded-xl shadow-sm border border-amber-200 text-sm text-amber-900">
                      <h3 className="font-bold flex items-center gap-2 mb-2">
                        <Info size={16} /> Quick Instructions
                      </h3>
                      <ul className="list-disc pl-4 space-y-1">
                        <li>Set temperature and calculate theoretical speed.</li>
                        <li>Strike the fork and adjust length to find the 3 loudest resonance points.</li>
                        <li>Take a snapshot at your setup.</li>
                        <li>Record lengths in <strong>meters</strong> in the table.</li>
                      </ul>
                    </div>
                  </div>

                  {/* RIGHT: LAB REPORT PANEL */}
                  <div className="lg:col-span-8 space-y-6">
                    
                    {/* Student Info & Snapshot */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                      <h2 className="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Lab Report: Sound and Resonance</h2>
                      
                      <div className="grid grid-cols-2 gap-4 mb-6">
                        <div>
                          <label className="block text-sm font-medium text-slate-600 mb-1">Student Name</label>
                          <input 
                            type="text" value={studentName} onChange={e => setStudentName(e.target.value)}
                            className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="Enter your name"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-600 mb-1">Date</label>
                          <input 
                            type="text" value={studentDate} onChange={e => setStudentDate(e.target.value)}
                            className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <h3 className="text-sm font-medium text-slate-600 mb-2">Setup Photo (Required)</h3>
                        {snapshot ? (
                          <div className="bg-slate-50 p-4 border rounded-lg flex flex-col sm:flex-row items-center gap-6">
                            <div className="w-32 h-40 bg-white border-4 border-white shadow-md relative overflow-hidden flex-shrink-0">
                              {renderSVG(snapshot.tubeLength, snapshot.temp, false)}
                            </div>
                            <div className="text-sm text-slate-600 font-mono space-y-1">
                              <p><span className="font-semibold">Recorded by:</span> {snapshot.studentName}</p>
                              <p><span className="font-semibold">Date/Time:</span> {snapshot.date} {snapshot.timestamp}</p>
                              <p><span className="font-semibold">Temperature:</span> {snapshot.temp.toFixed(1)}°C</p>
                              <p><span className="font-semibold">Tube Length:</span> {snapshot.tubeLength.toFixed(1)} cm</p>
                              <div className="mt-2 inline-block px-2 py-1 bg-green-100 text-green-800 rounded text-xs font-sans font-bold uppercase tracking-wider">
                                Verified Authentic Snapshot
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center text-slate-500">
                            <Camera size={32} className="mx-auto mb-2 opacity-50" />
                            <p className="text-sm">No photo attached. Use the "Capture Setup Snapshot" button in the simulation panel.</p>
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Part 1: Theoretical Speed */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                      <h2 className="text-lg font-bold text-slate-800 mb-4">Theoretical Speed of Sound</h2>
                      <table className="w-full text-left border-collapse mb-4">
                        <thead>
                          <tr className="bg-slate-100 text-slate-700 text-sm">
                            <th className="p-3 border">Temperature (°C)</th>
                            <th className="p-3 border">Theoretical Speed of Sound <br/><span className="font-normal text-xs">(331.4 + 0.6Tc)</span></th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td className="p-3 border font-mono bg-slate-50">{temp.toFixed(1)}</td>
                            <td className="p-3 border">
                              <input 
                                type="number" step="any" placeholder="m/s"
                                value={theoV} onChange={e => { setTheoV(e.target.value); setFeedback(prev => ({...prev, theoV: null})); }}
                                className={`w-full p-2 border rounded outline-none font-mono ${getBorderColor(feedback.theoV)}`}
                              />
                            </td>
                          </tr>
                        </tbody>
                      </table>
                      <label className="block text-sm font-medium text-slate-600 mb-1">Show computation of the Theoretical Speed of Sound:</label>
                      <textarea 
                        className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono" 
                        rows="2" placeholder="e.g. vs = 331.4 + 0.6 * 20 = ..."
                        value={theoWork} onChange={e => setTheoWork(e.target.value)}
                      ></textarea>
                    </div>

                    {/* Part 2: Experimental Speed */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                      <h2 className="text-lg font-bold text-slate-800 mb-4">Experimentally Determined Speed of Sound</h2>
                      <div className="overflow-x-auto mb-4">
                        <table className="w-full text-left border-collapse min-w-[600px]">
                          <thead>
                            <tr className="bg-slate-100 text-slate-700 text-xs">
                              <th className="p-2 border">Measured Length (L) (m)</th>
                              <th className="p-2 border">Equation for Wavelength</th>
                              <th className="p-2 border">Calculated Wavelength (λ) from L (m)</th>
                              <th className="p-2 border">Frequency (Hz)</th>
                              <th className="p-2 border">Exp. Speed (m/s)</th>
                              <th className="p-2 border">% Difference from Theo. Speed</th>
                            </tr>
                          </thead>
                          <tbody>
                            {tableData.map((row, i) => (
                              <tr key={i}>
                                <td className="p-2 border">
                                  <input type="number" step="any" placeholder={`L${i+1} in meters`} value={row.L} onChange={e => updateTable(i, 'L', e.target.value)} className="w-full p-1.5 border rounded outline-none font-mono text-sm" />
                                </td>
                                <td className="p-2 border bg-slate-50 font-mono text-sm text-center">
                                  {i === 0 ? 'λ = 4L' : i === 1 ? 'λ = 4L/3' : 'λ = 4L/5'}
                                </td>
                                <td className="p-2 border">
                                  <input type="number" step="any" value={row.lambda} onChange={e => updateTable(i, 'lambda', e.target.value)} className={`w-full p-1.5 border rounded outline-none font-mono text-sm ${getBorderColor(feedback[`lambda_${i}`])}`} />
                                </td>
                                <td className="p-2 border bg-slate-50 font-mono text-sm text-center">2048</td>
                                <td className="p-2 border">
                                  <input type="number" step="any" value={row.v} onChange={e => updateTable(i, 'v', e.target.value)} className={`w-full p-1.5 border rounded outline-none font-mono text-sm ${getBorderColor(feedback[`v_${i}`])}`} />
                                </td>
                                <td className="p-2 border">
                                  <input type="number" step="any" value={row.error} onChange={e => updateTable(i, 'error', e.target.value)} className={`w-full p-1.5 border rounded outline-none font-mono text-sm ${getBorderColor(feedback[`err_${i}`])}`} />
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                      <div className="space-y-4">
                        <div>
                          <label className="block text-sm font-medium text-slate-600 mb-1">Show the calculation of speed of sound from measurements:</label>
                          <textarea 
                            className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono" 
                            rows="2" placeholder="e.g. v = f * λ = 2048 * 0.168 = ..."
                            value={expWork} onChange={e => setExpWork(e.target.value)}
                          ></textarea>
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-slate-600 mb-1">Show the calculation of Percent Difference:</label>
                          <p className="text-xs text-slate-400 mb-2 font-mono">Use formula: |(Exp - Theo) / ((Exp + Theo) / 2)| * 100</p>
                          <textarea 
                            className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono" 
                            rows="2" placeholder="Show your % difference work here..."
                            value={diffWork} onChange={e => setDiffWork(e.target.value)}
                          ></textarea>
                        </div>
                      </div>
                      
                      <div className="mt-6 flex justify-end print:hidden">
                        <button 
                          onClick={verifyMath}
                          className="flex items-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors shadow-sm"
                        >
                          <CheckCircle2 size={18} /> Verify Table Math
                        </button>
                      </div>

                    </div>

                  </div>
                </div>
              </div>
            </div>
          );
        }

        // Mount the app to the DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
