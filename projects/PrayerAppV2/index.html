<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Tracker</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Ensure dark mode is controlled by the class on <html>
            theme: {
                extend: {
                    // You can extend the theme here if needed
                }
            }
        }
    </script>

    <script src="//unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.19.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.19.1/firebase-firestore.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.19.1/firebase-auth.js" type="module"></script>

    <script type="module">
        import prayerApp from './js/alpineComponent.js';
        // Make the component available globally for Alpine
        window.prayerApp = prayerApp;
    </script>

    <style>
        /* Basic scrollbar styling for dark mode */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; } /* gray-800 */
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; } /* gray-600 */
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; } /* gray-500 */
        [x-cloak] { display: none !important; } /* Hide elements until Alpine initializes */
    </style>
</head>
<body class="bg-gray-900 text-gray-200 antialiased min-h-screen">

    <div class="container mx-auto max-w-3xl p-4 md:p-8"
         x-data="prayerApp()"
         x-init="init()"
         x-cloak>

        <template x-if="isLoading">
            <div class="text-center py-10 text-gray-400">
                Loading...
            </div>
        </template>

        <template x-if="!isLoggedIn && !isLoading">
            <div class="max-w-md mx-auto mt-10 p-6 bg-gray-800 rounded-lg shadow-md border border-gray-700">
                <h2 class="text-2xl font-semibold text-center text-gray-100 mb-6">Shared Prayer Tracker</h2>
                <p class="text-center text-gray-400 mb-6 text-sm">Log in or sign up to continue</p>

                 <template x-if="authError">
                     <div class="bg-red-900 border border-red-700 text-red-200 px-4 py-2 rounded mb-4 text-sm" role="alert">
                        <span class="font-medium">Error:</span> <span x-text="authError"></span>
                     </div>
                </template>

                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                    <input type="email" id="email" x-model="email" placeholder="your@email.com" required autocomplete="email"
                           class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-500">
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                    <input type="password" id="password" x-model="password" placeholder="••••••••" required autocomplete="current-password"
                           class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-500">
                </div>
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                     <button @click="logIn()"
                            class="w-full sm:w-auto px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md shadow transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-blue-500">
                        Log In
                    </button>
                     <button @click="signUp()"
                            class="w-full sm:w-auto px-5 py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-md shadow transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-green-500">
                        Sign Up
                    </button>
                </div>
            </div>
        </template>

        <template x-if="isLoggedIn">
            <div> <div class="flex justify-between items-center mb-6 pb-2 border-b border-gray-700">
                     <h1 class="text-3xl font-bold text-blue-400">Prayer Tracker</h1>
                     <div class="flex items-center space-x-3">
                         <span class="text-sm text-gray-400 hidden sm:inline" x-text="currentUser ? currentUser.email : ''"></span>
                         <button @click="logOut()"
                                class="px-3 py-1 rounded bg-red-600 hover:bg-red-700 text-white text-xs font-medium shadow transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-red-500">
                            Log Out
                        </button>
                     </div>
                </div>

                <div class="flex justify-center space-x-4 mb-6">
                    <button @click="exportPrayers()" title="Export a local backup of currently viewed prayers (does not interact with shared list)"
                            class="px-3 py-1 rounded bg-gray-600 hover:bg-gray-700 text-white text-sm font-medium shadow transition duration-150 ease-in-out">
                        Export Local Backup
                    </button>
                    <button @click="importPrayers()" title="Import prayers into the local view only (does not save to shared list)"
                            class="px-3 py-1 rounded bg-gray-600 hover:bg-gray-700 text-white text-sm font-medium shadow transition duration-150 ease-in-out">
                        Import Locally (Temporary)
                    </button>
                </div>


                <form @submit.prevent="addPrayer()" class="mb-8 p-6 bg-gray-800 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-4 text-gray-100">Add New Prayer Request</h2>
                    <div class="mb-4">
                        <label for="newTitle" class="block text-sm font-medium text-gray-300 mb-1">Title <span class="text-red-500">*</span></label>
                        <input type="text" id="newTitle" x-model="newPrayerTitle" placeholder="e.g., Guidance for project" required
                               class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label for="newDescription" class="block text-sm font-medium text-gray-300 mb-1">Description (Optional)</label>
                        <textarea id="newDescription" x-model="newPrayerDescription" rows="3" placeholder="Add any details or notes here..."
                                  class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>
                    <button type="submit"
                            class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md shadow transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-blue-500">
                        Add Prayer
                    </button>
                </form>

                <div class="mb-6 flex justify-center space-x-2 sm:space-x-4 border-b border-gray-700 pb-2">
                    <button @click="setView('all')"
                            :class="{ 'bg-gray-700 text-blue-400 border-blue-400': isViewActive('all'), 'text-gray-400 hover:text-gray-200 border-transparent hover:border-gray-600': !isViewActive('all') }"
                            class="px-3 sm:px-4 py-2 rounded-t-md font-medium border-b-2 transition duration-150 ease-in-out">
                        All (<span x-text="prayers.length"></span>)
                    </button>
                    <button @click="setView('unanswered')"
                            :class="{ 'bg-gray-700 text-blue-400 border-blue-400': isViewActive('unanswered'), 'text-gray-400 hover:text-gray-200 border-transparent hover:border-gray-600': !isViewActive('unanswered') }"
                            class="px-3 sm:px-4 py-2 rounded-t-md font-medium border-b-2 transition duration-150 ease-in-out">
                        Unanswered (<span x-text="prayers.filter(p => !p.isAnswered).length"></span>)
                    </button>
                    <button @click="setView('answered')"
                            :class="{ 'bg-gray-700 text-blue-400 border-blue-400': isViewActive('answered'), 'text-gray-400 hover:text-gray-200 border-transparent hover:border-gray-600': !isViewActive('answered') }"
                            class="px-3 sm:px-4 py-2 rounded-t-md font-medium border-b-2 transition duration-150 ease-in-out">
                        Answered (<span x-text="prayers.filter(p => p.isAnswered).length"></span>)
                    </button>
                </div>

                <div class="space-y-4">
                    <template x-if="filteredPrayers.length === 0">
                        <p class="text-center text-gray-500 italic py-6" x-text="currentView === 'all' ? 'No prayers added yet. Add one above!' : (currentView === 'answered' ? 'No answered prayers yet.' : 'No unanswered prayers.')"></p>
                    </template>

                    <template x-for="prayer in filteredPrayers" :key="prayer.id">
                        <div class="p-4 bg-gray-800 rounded-lg shadow-md border border-gray-700 transition duration-300 ease-in-out hover:border-gray-600">
                            <template x-if="editingPrayer && editingPrayer.id === prayer.id">
                                <div class="edit-form">
                                    <h3 class="text-lg font-semibold mb-3 text-gray-100">Edit Prayer</h3>
                                    <div class="mb-3">
                                        <label :for="'editTitle-' + prayer.id" class="block text-sm font-medium text-gray-300 mb-1">Title <span class="text-red-500">*</span></label>
                                        <input type="text" :id="'editTitle-' + prayer.id" x-model="editTitle" required
                                               class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    </div>
                                    <div class="mb-3">
                                        <label :for="'editDesc-' + prayer.id" class="block text-sm font-medium text-gray-300 mb-1">Description</label>
                                        <textarea :id="'editDesc-' + prayer.id" x-model="editDescription" rows="4"
                                                  class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                                    </div>
                                    <div class="flex justify-end space-x-2 mt-2">
                                        <button @click="cancelEdit()" class="px-3 py-1 bg-gray-600 hover:bg-gray-500 text-white text-sm font-medium rounded-md shadow transition duration-150 ease-in-out">Cancel</button>
                                        <button @click="saveEdit()" class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-md shadow transition duration-150 ease-in-out">Save Changes</button>
                                    </div>
                                </div>
                            </template>

                            <template x-if="!editingPrayer || editingPrayer.id !== prayer.id">
                                <div>
                                    <div class="flex justify-between items-start mb-2 gap-2">
                                        <h3 class="text-lg font-semibold text-gray-100 break-words mr-2 flex-1" x-text="prayer.title"></h3>
                                        <div class="flex-shrink-0 flex items-center space-x-2">
                                            <button @click="toggleAnswered(prayer.id)"
                                                    :class="prayer.isAnswered ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-green-600 hover:bg-green-700'"
                                                    class="px-2 py-1 text-xs font-medium text-white rounded-md shadow transition duration-150 ease-in-out"
                                                    :title="prayer.isAnswered ? 'Mark as Unanswered' : 'Mark as Answered'">
                                                <span x-text="prayer.isAnswered ? 'Unmark' : 'Answered?'"></span>
                                            </button>
                                            <button @click="logPrayerPrayed(prayer.id)"
                                                    x-show="!prayer.isAnswered"
                                                    title="Log Prayed For"
                                                    class="p-1 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-md shadow transition duration-150 ease-in-out">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                                                </svg>
                                            </button>
                                            <button @click="startEditing(prayer)" title="Edit Prayer" class="p-1 text-gray-400 hover:text-blue-400 transition duration-150 ease-in-out">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
                                            </button>
                                            <button @click="deletePrayer(prayer.id)" title="Delete Prayer" class="p-1 text-gray-400 hover:text-red-500 transition duration-150 ease-in-out">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                                            </button>
                                        </div>
                                    </div>

                                    <p class="text-gray-400 text-sm mb-3 whitespace-pre-wrap break-words" x-show="prayer.description" x-html="prayer.description ? prayer.description.replace(/\n/g, '<br>') : ''"></p> <div class="text-xs text-gray-500 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1 sm:gap-2">
                                        <span>Added: <span x-text="formatDate(prayer.dateAdded)"></span> <span x-show="prayer.addedByEmail">(by <span x-text="prayer.addedByEmail"></span>)</span></span>
                                        <span x-show="prayer.isAnswered" class="text-green-400 font-medium">
                                            Answered: <span x-text="formatDate(prayer.dateAnswered)"></span>
                                        </span>
                                    </div>
                                </div>
                            </template>
                        </div> </template> </div> <div class="mt-8 text-center" x-show="prayers.some(p => p.isAnswered)">
                     <button @click="deleteAllAnswered()"
                            class="px-4 py-2 bg-red-700 hover:bg-red-800 text-white text-sm font-medium rounded-md shadow transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-red-500">
                        Delete All Answered Prayers (Not Implemented)
                    </button>
                </div>

            </div> </template> </div> </body>
</html>
