<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Task Manager V3</title>

  <!-- Tailwind CSS with dark mode -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <script type="module" src="./js/alpineComponent.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.13.8/dist/cdn.min.js"></script>

  <!-- Day.js -->
  <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>

</head>
<body x-data="taskApp" x-init="init()" class="bg-gray-900 text-white min-h-screen p-4">

  <header class="mb-4">
    <h1 class="text-2xl font-bold mb-2">Personal Task Manager</h1>
    <form @submit.prevent="addTask(newTaskTitle)" class="flex gap-2">
      <input type="text" x-model="newTaskTitle" placeholder="Add new task..." class="flex-1 p-2 rounded bg-gray-800 border border-gray-700" required>
      <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded">Add</button>
    </form>
  </header>

  <nav class="mb-4 flex gap-2">
    <button @click="currentView = 'inbox'" :class="{'bg-blue-700': currentView==='inbox'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      Inbox
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="inboxCount"></span>
    </button>
    <button @click="currentView = 'today'" :class="{'bg-blue-700': currentView==='today'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      Today
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="todayCount"></span>
    </button>
    <button @click="currentView = 'week'" :class="{'bg-blue-700': currentView==='week'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      This Week
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="weekCount"></span>
    </button>
    <button @click="currentView = 'month'" :class="{'bg-blue-700': currentView==='month'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      This Month
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="monthCount"></span>
    </button>
    <button @click="currentView = 'year'" :class="{'bg-blue-700': currentView==='year'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      This Year
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="yearCount"></span>
    </button>
    <button @click="currentView = 'future'" :class="{'bg-blue-700': currentView==='future'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      Far Future
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="futureCount"></span>
    </button>
    <button @click="currentView = 'allIncomplete'" :class="{'bg-blue-700': currentView==='allIncomplete'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      All Incomplete
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="allIncompleteCount"></span>
    </button>
    <button @click="currentView = 'completed'" :class="{'bg-blue-700': currentView==='completed'}" class="relative px-3 py-1 rounded bg-gray-700 hover:bg-gray-600">
      Completed
      <span class="absolute -top-1 -right-1 text-xs bg-teal-600 text-white rounded-full px-1.5 py-0.5" x-text="completedCount"></span>
    </button>
  </nav>

  <!-- Inbox View -->
  <section x-show="currentView === 'inbox'">
    <h2 class="text-xl font-semibold mb-2">
      Inbox
      <span class="ml-1 text-sm text-teal-400" x-text="inboxCount"></span>
    </h2>
    <template x-for="task in inboxTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="editTask(task)" class="text-yellow-400 hover:underline">Edit</button>
          <button @click="confirmDelete(task.id)" class="text-red-400 hover:underline">Delete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- Today View -->
  <section x-show="currentView === 'today'">
    <h2 class="text-xl font-semibold mb-2">
      Today
      <span class="ml-1 text-sm text-teal-400" x-text="todayCount"></span>
    </h2>
    <template x-for="task in todayTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="editTask(task)" class="text-yellow-400 hover:underline">Edit</button>
          <button @click="toggleComplete(task.id)" class="text-green-400 hover:underline">Complete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- Week View -->
  <section x-show="currentView === 'week'">
    <h2 class="text-xl font-semibold mb-2">
      This Week
      <span class="ml-1 text-sm text-teal-400" x-text="weekCount"></span>
    </h2>
    <template x-for="task in weekTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="editTask(task)" class="text-yellow-400 hover:underline">Edit</button>
          <button @click="toggleComplete(task.id)" class="text-green-400 hover:underline">Complete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- All Incomplete View -->
  <section x-show="currentView === 'allIncomplete'">
    <h2 class="text-xl font-semibold mb-2">
      All Incomplete Tasks
      <span class="ml-1 text-sm text-teal-400" x-text="allIncompleteCount"></span>
    </h2>
    <template x-for="task in allIncompleteTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="editTask(task)" class="text-yellow-400 hover:underline">Edit</button>
          <button @click="toggleComplete(task.id)" class="text-green-400 hover:underline">Complete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- Completed View -->
  <section x-show="currentView === 'completed'">
    <h2 class="text-xl font-semibold mb-2">
      Completed Tasks
      <span class="ml-1 text-sm text-teal-400" x-text="completedCount"></span>
    </h2>
    <button @click="confirmBulkDelete()" class="mb-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded">Bulk Delete Completed</button>
    <template x-for="task in completedTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center line-through">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="confirmDelete(task.id)" class="text-red-400 hover:underline">Delete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- Month View -->
  <section x-show="currentView === 'month'">
    <h2 class="text-xl font-semibold mb-2">
      This Month
      <span class="ml-1 text-sm text-teal-400" x-text="monthCount"></span>
    </h2>
    <template x-for="task in monthTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="editTask(task)" class="text-yellow-400 hover:underline">Edit</button>
          <button @click="toggleComplete(task.id)" class="text-green-400 hover:underline">Complete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- Year View -->
  <section x-show="currentView === 'year'">
    <h2 class="text-xl font-semibold mb-2">
      This Year
      <span class="ml-1 text-sm text-teal-400" x-text="yearCount"></span>
    </h2>
    <template x-for="task in yearTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="editTask(task)" class="text-yellow-400 hover:underline">Edit</button>
          <button @click="toggleComplete(task.id)" class="text-green-400 hover:underline">Complete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- Far Future View -->
  <section x-show="currentView === 'future'">
    <h2 class="text-xl font-semibold mb-2">
      Far Future
      <span class="ml-1 text-sm text-teal-400" x-text="futureCount"></span>
    </h2>
    <template x-for="task in futureTasks" :key="task.id">
      <div class="border border-gray-700 p-2 mb-2 rounded bg-gray-800 flex justify-between items-center">
        <div>
          <div class="font-semibold" x-text="task.title"></div>
          <div class="text-xs text-teal-400 italic">
            <span x-show="task.dueDate" x-text="dayjs(task.dueDate).format('MMM D, YYYY')"></span>
            <span x-show="!task.dueDate">No due date</span>
            <span x-show="task.timeEstimate">&nbsp;|&nbsp;<span x-text="task.timeEstimate"></span></span>
          </div>
          <div class="text-sm text-gray-400" x-text="task.description"></div>
        </div>
        <div class="flex gap-2">
          <button @click="editTask(task)" class="text-yellow-400 hover:underline">Edit</button>
          <button @click="toggleComplete(task.id)" class="text-green-400 hover:underline">Complete</button>
        </div>
      </div>
    </template>
  </section>

  <!-- Modal for Editing Task -->
  <div x-show="showEditModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-gray-800 p-4 rounded w-96">
      <h3 class="text-lg font-semibold mb-2">Edit Task</h3>
      <form @submit.prevent="saveEdit()">
        <div class="mb-2">
          <label class="block mb-1">Title</label>
          <input type="text" x-model="editTaskData.title" class="w-full p-2 rounded bg-gray-700 border border-gray-600" required>
        </div>
        <div class="mb-2">
          <label class="block mb-1">Description</label>
          <textarea x-model="editTaskData.description" class="w-full p-2 rounded bg-gray-700 border border-gray-600"></textarea>
        </div>
        <div class="mb-2">
          <label class="block mb-1">Due Date</label>
          <input type="date" x-model="editTaskData.dueDate" class="w-full p-2 rounded bg-gray-700 border border-gray-600">
        </div>
        <div class="mb-4">
          <label class="block mb-1">Time Estimate</label>
          <select x-model="editTaskData.timeEstimate" class="w-full p-2 rounded bg-gray-700 border border-gray-600">
            <option value="">Select</option>
            <option value="5m">5m</option>
            <option value="20m">20m</option>
            <option value="1h">1h</option>
            <option value="3h">3h</option>
            <option value="6h">6h</option>
            <option value="Supertask">Supertask</option>
          </select>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" @click="showEditModal=false" class="px-3 py-1 bg-gray-600 hover:bg-gray-500 rounded">Cancel</button>
          <button type="submit" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Import JS modules -->

</body>
</html>
