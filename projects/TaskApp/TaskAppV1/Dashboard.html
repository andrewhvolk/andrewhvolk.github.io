<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Style for completed tasks */
      .completed span.item-text { /* Target only the text span for strikethrough */
        text-decoration: line-through;
        opacity: 0.6;
      }
      /* Ensure SVGs within buttons align nicely */
      button img {
        display: inline-block;
        vertical-align: middle;
      }
      /* Prevent clicks on icons interfering with button clicks */
      img.icon {
          pointer-events: none;
      }
      /* Base list item styling */
      .task-item {
        transition: background-color 0.2s ease-in-out;
      }
      /* Color coding borders */
      .task-item.type-appointments { border-left: 4px solid #3b82f6; } /* blue-500 */
      .task-item.type-todos { border-left: 4px solid #22c55e; } /* green-500 */
      .task-item.type-errands { border-left: 4px solid #eab308; } /* yellow-500 */
    </style>
    <script>
      // Basic Tailwind configuration
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
             colors: { // Define colors for easier reference if needed
                'task-blue': '#3b82f6',
                'task-green': '#22c55e',
                'task-yellow': '#eab308',
            }
          }
        }
      }
    </script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-lg p-6">

        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Daily Dashboard</h1>
            <p id="current-date" class="text-gray-500"></p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
             <section class="bg-blue-50 p-4 rounded-lg shadow-sm">
                <h2 class="text-lg font-semibold text-blue-800 mb-3 flex items-center">
                    <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/calendar-plus.svg" alt="Add Appointment" class="icon w-5 h-5 mr-2 inline-block"/>
                    Add Appointment
                </h2>
                <div class="flex">
                    <input type="text" id="appointment-input" placeholder="New appointment..." class="flex-grow border border-gray-300 rounded-l-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="addItem('appointments')" class="bg-blue-500 text-white px-3 py-2 rounded-r-md hover:bg-blue-600 flex items-center justify-center">
                        <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/plus.svg" alt="Add" class="icon w-4 h-4"/>
                    </button>
                </div>
                 <ul id="appointments-list" class="mt-4 space-y-2">
                    </ul>
            </section>

             <section class="bg-green-50 p-4 rounded-lg shadow-sm">
                <h2 class="text-lg font-semibold text-green-800 mb-3 flex items-center">
                     <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/list-plus.svg" alt="Add Task" class="icon w-5 h-5 mr-2 inline-block"/>
                     Add To-Do Task
                </h2>
                <div class="flex">
                    <input type="text" id="todo-input" placeholder="New task..." class="flex-grow border border-gray-300 rounded-l-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                    <button onclick="addItem('todos')" class="bg-green-500 text-white px-3 py-2 rounded-r-md hover:bg-green-600 flex items-center justify-center">
                         <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/plus.svg" alt="Add" class="icon w-4 h-4"/>
                    </button>
                </div>
                 <ul id="todos-list" class="mt-4 space-y-2">
                     </ul>
            </section>

             <section class="bg-yellow-50 p-4 rounded-lg shadow-sm">
                <h2 class="text-lg font-semibold text-yellow-800 mb-3 flex items-center">
                    <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/shopping-cart.svg" alt="Add Errand" class="icon w-5 h-5 mr-2 inline-block"/>
                    Add Errand
                </h2>
                <div class="flex">
                    <input type="text" id="errand-input" placeholder="New errand..." class="flex-grow border border-gray-300 rounded-l-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500">
                    <button onclick="addItem('errands')" class="bg-yellow-500 text-white px-3 py-2 rounded-r-md hover:bg-yellow-600 flex items-center justify-center">
                         <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/plus.svg" alt="Add" class="icon w-4 h-4"/>
                    </button>
                </div>
                 <ul id="errands-list" class="mt-4 space-y-2">
                     </ul>
            </section>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <section class="bg-indigo-50 p-4 rounded-lg shadow">
                 <h2 class="text-xl font-semibold text-indigo-800 mb-4 flex items-center">
                    <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/calendar-check.svg" alt="Today" class="icon w-5 h-5 mr-2 inline-block"/>
                    Today
                </h2>
                <ul id="today-list" class="space-y-2 min-h-[100px]">
                    </ul>
            </section>

            <section class="bg-gray-50 p-4 rounded-lg shadow">
                 <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                     <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/archive.svg" alt="Future" class="icon w-5 h-5 mr-2 inline-block"/>
                     Future
                </h2>
                <ul id="future-list" class="space-y-2 min-h-[100px]">
                     </ul>
            </section>
        </div>

    </div>

    <script>
        // --- Constants for Local Storage ---
        const APPOINTMENTS_KEY = 'dashboard_appointments_initial'; // Renamed
        const TODOS_KEY = 'dashboard_todos_initial';          // Renamed
        const ERRANDS_KEY = 'dashboard_errands_initial';        // Renamed
        const TODAY_KEY = 'dashboard_today_items';            // New Key
        const FUTURE_KEY = 'dashboard_future_items';           // New Key

        // Map keys to list elements and input elements for easier access
        const listConfig = {
            [APPOINTMENTS_KEY]: { listEl: 'appointments-list', inputEl: 'appointment-input', type: 'appointments' },
            [TODOS_KEY]: { listEl: 'todos-list', inputEl: 'todo-input', type: 'todos' },
            [ERRANDS_KEY]: { listEl: 'errands-list', inputEl: 'errand-input', type: 'errands' },
            [TODAY_KEY]: { listEl: 'today-list', type: 'today' }, // No input for these
            [FUTURE_KEY]: { listEl: 'future-list', type: 'future' }, // No input for these
        };

        // --- DOM Elements ---
        const currentDateEl = document.getElementById('current-date');
        // Input and List elements will be accessed via listConfig

        // --- Utility Functions ---

        function getItems(key) {
            const items = localStorage.getItem(key);
            try {
                const parsed = JSON.parse(items);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function saveItems(key, items) {
            try {
                if (!Array.isArray(items)) {
                    console.error("Attempted to save non-array value to localStorage for key:", key);
                    return;
                }
                localStorage.setItem(key, JSON.stringify(items));
            } catch (e) {
                console.error("Error saving items to localStorage for key:", key, e);
            }
        }

        /**
         * Creates a list item element with appropriate controls and styling.
         * @param {object} item - The item object { text: string, completed: boolean, type: string }.
         * @param {number} index - The index of the item in its list.
         * @param {string} listKey - The localStorage key of the list this item belongs to.
         * @returns {HTMLElement} - The created list item element.
         */
        function createListItem(item, index, listKey) {
            const li = document.createElement('li');
            const itemType = item.type; // e.g., 'appointments', 'todos', 'errands'
            const listType = listConfig[listKey].type; // e.g., 'appointments', 'today', 'future'

            // Base classes + completion class
            li.className = `task-item flex items-center justify-between bg-white p-2 rounded-md shadow-sm group ${item.completed ? 'completed' : ''}`;
            li.dataset.index = index;
            li.dataset.key = listKey; // Store the key for easy reference in handlers

            // Add color coding border if the item is in Today or Future list
            if (listType === 'today' || listType === 'future') {
                 li.classList.add(`type-${itemType}`); // Add type-appointments, type-todos, etc.
            }

            // --- Left Side: Toggle Button ---
            const toggleButton = document.createElement('button');
            toggleButton.className = `flex-shrink-0 mr-2 p-1 rounded hover:bg-gray-100`;
            toggleButton.setAttribute('aria-label', item.completed ? 'Mark as pending' : 'Mark as complete');
            toggleButton.onclick = () => toggleItemComplete(listKey, index);

            const toggleIcon = document.createElement('img');
            toggleIcon.src = item.completed
                ? 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/check-circle.svg'
                : 'https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/circle.svg';
            toggleIcon.alt = item.completed ? 'Completed' : 'Pending';
            // Color changes based on completion and hover
             toggleIcon.className = `icon w-5 h-5 ${item.completed ? 'text-green-500' : 'text-gray-400'} group-hover:text-${item.completed ? 'green' : 'green'}-500`;
            toggleButton.appendChild(toggleIcon);

            // --- Center: Item Text ---
            const textSpan = document.createElement('span');
            textSpan.textContent = item.text;
            textSpan.className = 'item-text flex-grow break-words mx-2'; // Added horizontal margin

            // --- Right Side: Action Buttons ---
            const actionContainer = document.createElement('div');
            actionContainer.className = 'flex items-center space-x-1 ml-auto opacity-0 group-hover:opacity-100 transition-opacity';


            // Add Move Buttons based on the list type
             if (listType === 'appointments' || listType === 'todos' || listType === 'errands') {
                 // Move to Today button
                 const moveTodayButton = document.createElement('button');
                 moveTodayButton.className = 'p-1 rounded hover:bg-gray-200 text-indigo-600';
                 moveTodayButton.setAttribute('aria-label', 'Move to Today');
                 moveTodayButton.onclick = (e) => { e.stopPropagation(); moveItem(listKey, index, TODAY_KEY); };
                 moveTodayButton.innerHTML = `<img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/arrow-right.svg" alt="Move Today" class="icon w-4 h-4">`;
                 actionContainer.appendChild(moveTodayButton);

                 // Move to Future button
                 const moveFutureButton = document.createElement('button');
                 moveFutureButton.className = 'p-1 rounded hover:bg-gray-200 text-gray-600';
                 moveFutureButton.setAttribute('aria-label', 'Move to Future');
                 moveFutureButton.onclick = (e) => { e.stopPropagation(); moveItem(listKey, index, FUTURE_KEY); };
                 moveFutureButton.innerHTML = `<img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/archive.svg" alt="Move Future" class="icon w-4 h-4">`;
                 actionContainer.appendChild(moveFutureButton);

             } else if (listType === 'today') {
                  // Move to Future button
                 const moveFutureButton = document.createElement('button');
                 moveFutureButton.className = 'p-1 rounded hover:bg-gray-200 text-gray-600';
                 moveFutureButton.setAttribute('aria-label', 'Move to Future');
                 moveFutureButton.onclick = (e) => { e.stopPropagation(); moveItem(listKey, index, FUTURE_KEY); };
                 moveFutureButton.innerHTML = `<img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/arrow-right.svg" alt="Move Future" class="icon w-4 h-4">`;
                 actionContainer.appendChild(moveFutureButton);

             } else if (listType === 'future') {
                   // Move to Today button
                 const moveTodayButton = document.createElement('button');
                 moveTodayButton.className = 'p-1 rounded hover:bg-gray-200 text-indigo-600';
                 moveTodayButton.setAttribute('aria-label', 'Move to Today');
                 moveTodayButton.onclick = (e) => { e.stopPropagation(); moveItem(listKey, index, TODAY_KEY); };
                 moveTodayButton.innerHTML = `<img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/arrow-left.svg" alt="Move Today" class="icon w-4 h-4">`;
                 actionContainer.appendChild(moveTodayButton);
             }


            // Delete Button (always present)
            const deleteButton = document.createElement('button');
            deleteButton.className = 'p-1 rounded hover:bg-gray-200 text-red-500';
            deleteButton.setAttribute('aria-label', 'Delete item');
            deleteButton.onclick = (event) => {
                 event.stopPropagation();
                 deleteItem(listKey, index);
            }
            deleteButton.innerHTML = `<img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/trash-2.svg" alt="Delete" class="icon w-4 h-4">`;
            actionContainer.appendChild(deleteButton);


            // --- Assemble ListItem ---
            li.appendChild(toggleButton);
            li.appendChild(textSpan);
            li.appendChild(actionContainer);

             // Click listener for toggling completion (on the li itself, avoids buttons)
             li.addEventListener('click', (event) => {
                 // Ensure the click is directly on the LI or the text span, not on buttons container
                 if (event.target === li || event.target === textSpan) {
                     toggleItemComplete(listKey, index);
                 }
            });

            return li;
        }

        /**
         * Renders all lists on the dashboard.
         */
        function renderDashboard() {
            // Iterate through all configured lists and render them
            Object.keys(listConfig).forEach(key => {
                const config = listConfig[key];
                const listElement = document.getElementById(config.listEl);
                if (!listElement) return; // Skip if element doesn't exist

                const items = getItems(key);
                listElement.innerHTML = ''; // Clear existing list

                if (items.length === 0) {
                    const placeholder = document.createElement('li');
                    // Customize placeholder text slightly for different list types
                    if (config.type === 'today' || config.type === 'future') {
                         placeholder.textContent = 'No items here yet.';
                    } else {
                         placeholder.textContent = 'No items added.';
                    }

                    placeholder.className = 'text-gray-400 italic text-sm px-2';
                    listElement.appendChild(placeholder);
                } else {
                    items.forEach((item, index) => {
                        if (item && typeof item.text === 'string' && typeof item.type === 'string') {
                           const li = createListItem(item, index, key);
                           listElement.appendChild(li);
                        } else {
                            console.warn(`Skipping invalid item in list ${key} at index ${index}:`, item);
                        }
                    });
                }
            });
        }

        // --- Event Handlers ---

        /**
         * Adds a new item to the specified initial list.
         * @param {string} type - The type of item to add ('appointments', 'todos', 'errands').
         */
        function addItem(type) {
             let inputElementId;
             let listKey;

             // Find the correct key and input ID based on the 'type' argument
             for (const key in listConfig) {
                if (listConfig[key].type === type && listConfig[key].inputEl) {
                    listKey = key;
                    inputElementId = listConfig[key].inputEl;
                    break;
                }
             }

             if (!listKey || !inputElementId) {
                 console.error("Could not find configuration for type:", type);
                 return;
             }

             const inputElement = document.getElementById(inputElementId);
             const text = inputElement.value.trim();
             if (text === '') return;

             const items = getItems(listKey);
             // Add the 'type' property to the item object
             items.push({ text: text, completed: false, type: type });
             saveItems(listKey, items);
             renderDashboard(); // Re-render the whole dashboard
             inputElement.value = '';
             inputElement.focus();
        }

        /**
         * Toggles the completion status of an item in a specific list.
         * @param {string} listKey - The localStorage key of the list containing the item.
         * @param {number} index - The index of the item to toggle.
         */
        function toggleItemComplete(listKey, index) {
            const items = getItems(listKey);
            if (items && items[index] !== undefined) {
                items[index].completed = !(items[index].completed || false);
                saveItems(listKey, items);
                renderDashboard(); // Re-render affected list and potentially others
            } else {
                 console.error(`Item at index ${index} not found for toggle in list ${listKey}.`);
            }
        }

         /**
         * Moves an item from one list to another.
         * @param {string} sourceListKey - The localStorage key of the source list.
         * @param {number} index - The index of the item in the source list.
         * @param {string} destinationListKey - The localStorage key of the destination list.
         */
        function moveItem(sourceListKey, index, destinationListKey) {
            const sourceItems = getItems(sourceListKey);
            const destinationItems = getItems(destinationListKey);

            if (sourceItems && sourceItems[index] !== undefined) {
                // Remove item from source list
                const [itemToMove] = sourceItems.splice(index, 1);

                // Add item to destination list
                destinationItems.push(itemToMove);

                // Save both lists
                saveItems(sourceListKey, sourceItems);
                saveItems(destinationListKey, destinationItems);

                // Re-render the dashboard
                renderDashboard();
            } else {
                console.error(`Item at index ${index} not found for move in list ${sourceListKey}.`);
            }
        }


        /**
         * Deletes an item from a specific list.
         * @param {string} listKey - The localStorage key of the list containing the item.
         * @param {number} index - The index of the item to delete.
         */
        function deleteItem(listKey, index) {
            // Confirmation removed due to sandbox limitations.

            const items = getItems(listKey);
            if (items && items[index] !== undefined) {
                items.splice(index, 1);
                saveItems(listKey, items);
                renderDashboard(); // Re-render
            } else {
                 console.error(`Item at index ${index} not found for deletion in list ${listKey}.`);
            }
        }

        // --- Initialization ---

        function displayDate() {
             const now = new Date();
             const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
             const locale = navigator.language || 'en-US';
             currentDateEl.textContent = now.toLocaleDateString(locale, options);
        }

        function initializeDashboard() {
            displayDate();
            renderDashboard(); // Initial render of all lists

            // Add event listeners for Enter key in input fields
            Object.keys(listConfig).forEach(key => {
                const config = listConfig[key];
                if (config.inputEl) {
                    const inputElement = document.getElementById(config.inputEl);
                    inputElement.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                             e.preventDefault(); // Prevent potential form submission
                             addItem(config.type);
                        }
                    });
                }
            });
        }

        // --- Run Initialization ---
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeDashboard);
        } else {
            initializeDashboard();
        }

    </script>

</body>
</html>
