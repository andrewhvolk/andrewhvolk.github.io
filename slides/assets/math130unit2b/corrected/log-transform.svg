<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Transformed logarithmic graph</title>
  <desc id="desc">The graph of f of x equals log base 2 of x plus 1, plus 2. It has vertical asymptote x equals negative 1, x-intercept negative three fourths, and y-intercept 2.</desc>
  <rect width="900" height="620" fill="#fff"/>
  <g stroke="#d7e1ea" stroke-width="1">
    <path d="M100 40V560M180 40V560M260 40V560M340 40V560M420 40V560M500 40V560M580 40V560M660 40V560M740 40V560M820 40V560"/>
    <path d="M70 80H850M70 160H850M70 240H850M70 320H850M70 400H850M70 480H850M70 560H850"/>
  </g>
  <g stroke="#173b5e" stroke-width="4">
    <path d="M70 400H850"/>
    <path d="M340 40V570"/>
  </g>
  <g fill="#173b5e" font-family="Arial, sans-serif" font-size="22">
    <text x="840" y="430">x</text>
    <text x="355" y="62">y</text>
  </g>
  <path d="M260 40V560" stroke="#b42318" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="120" y="72" fill="#b42318" font-family="Arial, sans-serif" font-size="24">asymptote x = -1</text>
  <path d="M267 550 C271 480 279 408 300 320 C318 274 330 252 340 240 C370 204 395 179 420 160 C475 120 525 95 580 80 C660 58 740 45 825 36"
        fill="none" stroke="#075ea8" stroke-width="7" stroke-linecap="round"/>
  <g fill="#075ea8" stroke="#fff" stroke-width="4">
    <circle cx="270" cy="480" r="8"/>
    <circle cx="280" cy="400" r="8"/>
    <circle cx="340" cy="240" r="9"/>
    <circle cx="420" cy="160" r="8"/>
    <circle cx="580" cy="80" r="8"/>
  </g>
  <g fill="#173b5e" font-family="Arial, sans-serif" font-size="23">
    <text x="350" y="225">(0, 2)</text>
    <text x="285" y="390">(-3/4, 0)</text>
    <text x="500" y="125">f(x) = log₂(x + 1) + 2</text>
  </g>
</svg>
