<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" role="img" aria-labelledby="title desc">
<title id="title">The six trigonometric ratios</title><desc id="desc">A right triangle with angle theta, colored sides adjacent in blue, opposite in teal and hypotenuse in orange. Below it, sine is opposite over hypotenuse, cosine is adjacent over hypotenuse, tangent is opposite over adjacent. The reciprocals cosecant, secant and cotangent flip each fraction.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="40,300 300,300 300,105" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="280,300 280,280 300,280" fill="none" stroke="#163a5f" stroke-width="3"/><polyline points="88,300 87.941,297.625 87.765,295.256 87.472,292.898 87.062,290.558 86.537,288.241 85.898,285.953 85.147,283.699 84.285,281.485 83.315,279.316 82.238,277.198 81.059,275.136 79.778,273.135 78.4,271.2" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" /><text x="110.203" y="287.599" fill="#c45a0a" font-size="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">θ</text><line x1="40" y1="300" x2="300" y2="300" stroke="#075ea8" stroke-width="7" /><line x1="300" y1="300" x2="300" y2="105" stroke="#087f8c" stroke-width="7" /><line x1="40" y1="300" x2="300" y2="105" stroke="#c45a0a" stroke-width="7" /><polyline points="280,300 280,280 300,280" fill="none" stroke="#163a5f" stroke-width="3"/><text x="170" y="338" fill="#075ea8" font-size="28" text-anchor="middle" >adj</text><text x="314" y="212.5" fill="#087f8c" font-size="28" >opp</text><text x="90" y="188.5" fill="#c45a0a" font-size="28" >hyp</text><text x="40" y="420" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">sin θ =</text><text x="204" y="420" fill="#087f8c" font-size="30" text-anchor="end">opp</text><text x="212" y="420" fill="#163a5f" font-size="30" text-anchor="middle" >/</text><text x="220" y="420" fill="#c45a0a" font-size="30" >hyp</text><text x="350" y="420" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">csc θ =</text><text x="514" y="420" fill="#c45a0a" font-size="30" text-anchor="end">hyp</text><text x="522" y="420" fill="#163a5f" font-size="30" text-anchor="middle" >/</text><text x="530" y="420" fill="#087f8c" font-size="30" >opp</text><text x="40" y="482" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">cos θ =</text><text x="204" y="482" fill="#075ea8" font-size="30" text-anchor="end">adj</text><text x="212" y="482" fill="#163a5f" font-size="30" text-anchor="middle" >/</text><text x="220" y="482" fill="#c45a0a" font-size="30" >hyp</text><text x="350" y="482" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">sec θ =</text><text x="514" y="482" fill="#c45a0a" font-size="30" text-anchor="end">hyp</text><text x="522" y="482" fill="#163a5f" font-size="30" text-anchor="middle" >/</text><text x="530" y="482" fill="#075ea8" font-size="30" >adj</text><text x="40" y="544" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">tan θ =</text><text x="204" y="544" fill="#087f8c" font-size="30" text-anchor="end">opp</text><text x="212" y="544" fill="#163a5f" font-size="30" text-anchor="middle" >/</text><text x="220" y="544" fill="#075ea8" font-size="30" >adj</text><text x="350" y="544" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">cot θ =</text><text x="514" y="544" fill="#075ea8" font-size="30" text-anchor="end">adj</text><text x="522" y="544" fill="#163a5f" font-size="30" text-anchor="middle" >/</text><text x="530" y="544" fill="#087f8c" font-size="30" >opp</text><text x="150" y="370" fill="#163a5f" font-size="26" text-anchor="middle" font-weight="700">SOH · CAH · TOA</text><text x="470" y="370" fill="#526579" font-size="26" text-anchor="middle" >reciprocals: flip</text></g>
</svg>
