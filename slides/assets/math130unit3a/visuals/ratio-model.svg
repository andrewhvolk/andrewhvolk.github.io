<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" role="img" aria-labelledby="title desc">
<title id="title">Right triangle with sides 9, 40 and 41</title><desc id="desc">A tall right triangle drawn to scale. Angle theta is at the lower left. The adjacent leg is 9, the opposite leg is 40, and the hypotenuse is 41. A note checks that 9 squared plus 40 squared equals 41 squared.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="130,520 238,520 238,40" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="218,520 218,500 238,500" fill="none" stroke="#163a5f" stroke-width="3"/><polyline points="176,520 175.938,517.614 175.752,515.233 175.443,512.866 175.012,510.518 174.46,508.196 173.787,505.905 172.997,503.652 172.091,501.444 171.072,499.285 169.942,497.182 168.704,495.141 167.362,493.166 165.92,491.264 164.381,489.439 162.749,487.697 161.029,486.041 159.225,484.477 157.343,483.009 155.387,481.64 153.363,480.375 151.276,479.216 149.131,478.167 146.935,477.231 144.693,476.41 142.412,475.706 140.098,475.122" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" /><text x="186.223" y="486.022" fill="#c45a0a" font-size="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">θ</text><text x="184" y="560" fill="#075ea8" font-size="32" text-anchor="middle" >9</text><text x="254" y="280" fill="#087f8c" font-size="32" >40</text><text x="122" y="280" fill="#c45a0a" font-size="32" >41</text><text x="260" y="160" fill="#163a5f" font-size="28" >9² + 40² = 41²</text><text x="260" y="202" fill="#526579" font-size="24" >81 + 1600 = 1681</text></g>
</svg>
