<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" role="img" aria-labelledby="title desc">
<title id="title">A 25 foot ladder at 70 degrees</title><desc id="desc">A ladder 25 feet long leans against a wall. It makes a 70 degree angle with the ground. A dashed vertical segment h runs from the top of the ladder down to the ground and meets it at a right angle. The figure is drawn to scale.</desc>
