<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">A ramp rising 2 feet at 10 degrees</title><desc id="desc">A long, low right triangle drawn to scale. The ramp is the hypotenuse, marked with a question mark. It makes a 10 degree angle with the ground and rises 2 feet.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="70,300 670,300 670,194.204" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="652,300 652,282 670,282" fill="none" stroke="#163a5f" stroke-width="3"/><line x1="70" y1="300" x2="670" y2="194.204" stroke="#c45a0a" stroke-width="9" /><polyline points="190,300 189.987,298.255 189.949,296.51 189.886,294.766 189.797,293.023 189.683,291.281 189.543,289.541 189.379,287.804 189.189,286.069 188.973,284.337 188.733,282.608 188.467,280.883 188.177,279.162" fill="none" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" /><text x="215.444" y="298.275" fill="#163a5f" font-size="28" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">10°</text><text x="684" y="257.102" fill="#087f8c" font-size="28" >2 ft</text><text x="330" y="221.102" fill="#c45a0a" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">ramp = ?</text><text x="70" y="360" fill="#526579" font-size="24" >Drawn to scale: a 10° ramp is long and low.</text></g>
</svg>
