<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" role="img" aria-labelledby="title desc">
<title id="title">A right triangle from sine theta equals 5 over 6</title><desc id="desc">A right triangle drawn to scale with angle theta at the lower left, the side opposite theta equal to 5, the hypotenuse equal to 6, and the adjacent side marked with a question mark. A note reads sine theta equals 5 over 6.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="110,470 375.33,470 375.33,70" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="355.33,470 355.33,450 375.33,450" fill="none" stroke="#163a5f" stroke-width="3"/><polyline points="164,470 163.927,467.201 163.71,464.41 163.348,461.634 162.843,458.881 162.196,456.157 161.408,453.471 160.482,450.829 159.421,448.238 158.227,445.706 156.903,443.24 155.453,440.845 153.881,438.529 152.191,436.297 150.388,434.155 148.476,432.111 146.461,430.167 144.347,428.331 142.142,426.607 139.85,425" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" /><text x="180.49" y="443.17" fill="#c45a0a" font-size="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">θ</text><text x="242.665" y="510" fill="#075ea8" font-size="34" text-anchor="middle" >?</text><text x="391.33" y="280" fill="#087f8c" font-size="32" >5</text><text x="186.665" y="270" fill="#c45a0a" font-size="32" >6</text><text x="400" y="420" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">sin θ = 5/6</text></g>
</svg>
