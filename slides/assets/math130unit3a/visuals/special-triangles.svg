<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">The two special right triangles</title><desc id="desc">A 45-45-90 triangle with legs 1 and 1 and hypotenuse root 2. A 30-60-90 triangle with the short leg 1 opposite 30 degrees, the long leg root 3 opposite 60 degrees, and hypotenuse 2. Both are drawn to scale.</desc>
