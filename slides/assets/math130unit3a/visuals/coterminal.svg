<title id="title">Three coterminal angles</title><desc id="desc">One terminal side in Quadrant I at 45 degrees. A short orange arc shows 45 degrees. A blue spiral shows 405 degrees, one full turn more. A purple clockwise arc shows negative 315 degrees, one full turn less. All three end on the same terminal side.</desc>
