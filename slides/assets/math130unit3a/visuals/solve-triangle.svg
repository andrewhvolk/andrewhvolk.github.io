<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img" aria-labelledby="title desc">
<title id="title">Solving a right triangle</title><desc id="desc">Right triangle ABC with the right angle at C. Side a, opposite A, is 150; the hypotenuse c is 345. Side b and angles A and B are unknown. Drawn to scale.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="70,380 630,380 630,109.629" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="610,380 610,360 630,360" fill="none" stroke="#163a5f" stroke-width="3"/><text x="350" y="420" fill="#075ea8" font-size="28" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">b = ?</text><text x="644" y="254.815" fill="#087f8c" font-size="28" >a = 150</text><text x="230" y="224.815" fill="#c45a0a" font-size="28" >c = 345</text><polyline points="140,380 139.951,377.377 139.803,374.757 139.558,372.145 139.215,369.544 138.774,366.958 138.237,364.389 137.604,361.843 136.876,359.323 136.055,356.831 135.14,354.372 134.134,351.949 133.037,349.565" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" /><text x="163.582" y="369.591" fill="#c45a0a" font-size="24" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">A = ?</text><text x="36" y="390" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</text><text x="640" y="414" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">C</text><text x="624" y="93.629" fill="#163a5f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-style="italic">B</text><text x="538" y="165.629" fill="#6d3bb5" font-size="24" font-family="Georgia, 'Times New Roman', serif" font-style="italic">B = ?</text></g>
