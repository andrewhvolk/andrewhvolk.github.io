<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="title desc">
<title id="title">The three sides named from angle theta</title><desc id="desc">A right triangle with angle theta at the lower left. The blue bottom leg touching theta is the adjacent side. The teal vertical leg across from theta is the opposite side. The orange side across from the right angle is the hypotenuse.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="70,420 510,420 510,90" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="490,420 490,400 510,400" fill="none" stroke="#163a5f" stroke-width="3"/><polyline points="140,420 139.914,416.536 139.657,413.081 139.23,409.643 138.632,406.23 137.867,402.851 136.935,399.514 135.84,396.227 134.583,392.999 133.168,389.836 131.598,386.748 129.877,383.741 128.01,380.822 126,378" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" /><text x="161.074" y="400.642" fill="#c45a0a" font-size="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">θ</text><line x1="70" y1="420" x2="510" y2="420" stroke="#075ea8" stroke-width="8" /><line x1="510" y1="420" x2="510" y2="90" stroke="#087f8c" stroke-width="8" /><line x1="70" y1="420" x2="510" y2="90" stroke="#c45a0a" stroke-width="8" /><polyline points="486,420 486,396 510,396" fill="none" stroke="#163a5f" stroke-width="3"/><text x="290" y="464" fill="#075ea8" font-size="30" text-anchor="middle" >adjacent to θ</text><text x="528" y="265" fill="#087f8c" font-size="30" >opposite θ</text><text x="140" y="233" fill="#c45a0a" font-size="30" >hypotenuse</text></g>
</svg>
