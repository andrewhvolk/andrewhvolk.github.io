<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Two right triangles that share a height</title><desc id="desc">A tower of height h. From a far point the angle of elevation is 40 degrees; from a point 50 feet closer it is 55 degrees. The near point is d feet from the base. Both triangles share the height h. Drawn to scale.</desc>
