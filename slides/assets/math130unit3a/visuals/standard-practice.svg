<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Axes for sketching 310 degrees</title><desc id="desc">Empty coordinate axes with Quadrants I through IV and the quarter-turn marks 90, 180, 270 and 360 degrees. The initial side is drawn on the positive x-axis. No terminal side is drawn.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><line x1="60" y1="290" x2="540" y2="290" stroke="#526579" stroke-width="3" marker-end="url(#arrow-muted)"/><line x1="300" y1="530" x2="300" y2="50" stroke="#526579" stroke-width="3" marker-end="url(#arrow-muted)"/><line x1="540" y1="290" x2="60" y2="290" stroke="#526579" stroke-width="3" marker-end="url(#arrow-muted)"/><line x1="300" y1="50" x2="300" y2="530" stroke="#526579" stroke-width="3" marker-end="url(#arrow-muted)"/><text x="532" y="324" fill="#526579" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-style="italic">x</text><text x="314" y="72" fill="#526579" font-size="28" font-family="Georgia, 'Times New Roman', serif" font-style="italic">y</text><text x="405.217" y="194.783" fill="#cbd5e1" font-size="34" text-anchor="middle" font-weight="700">I</text><text x="194.783" y="194.783" fill="#cbd5e1" font-size="34" text-anchor="middle" font-weight="700">II</text><text x="194.783" y="405.217" fill="#cbd5e1" font-size="34" text-anchor="middle" font-weight="700">III</text><text x="405.217" y="405.217" fill="#cbd5e1" font-size="34" text-anchor="middle" font-weight="700">IV</text><text x="316" y="91.6" fill="#526579" font-size="22" >90°</text><text x="85.6" y="276" fill="#526579" font-size="22" text-anchor="end">180°</text><text x="316" y="504.4" fill="#526579" font-size="22" >270°</text><text x="522.4" y="276" fill="#526579" font-size="22" >360°</text><line x1="300" y1="290" x2="492" y2="290" stroke="#075ea8" stroke-width="6" /><text x="396" y="276" fill="#075ea8" font-size="24" >initial side</text><text x="300" y="575" fill="#163a5f" font-size="28" text-anchor="middle" >Sketch 310° here.</text></g>
</svg>
