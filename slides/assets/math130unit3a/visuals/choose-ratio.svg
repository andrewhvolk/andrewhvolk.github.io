<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
<title id="title">Choosing the ratio</title><desc id="desc">A right triangle with angle theta and its sides colored: adjacent blue, opposite teal, hypotenuse orange. A table pairs the two sides in a problem with a ratio: hypotenuse and opposite use sine, hypotenuse and adjacent use cosine, adjacent and opposite use tangent. Below: if the unknown is in the numerator, multiply; if it is in the denominator, divide.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="50,330 350,330 350,105" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="330,330 330,310 350,310" fill="none" stroke="#163a5f" stroke-width="3"/><polyline points="100,330 99.939,327.526 99.755,325.058 99.45,322.602 99.023,320.165 98.476,317.751 97.811,315.367 97.028,313.02 96.131,310.713 95.12,308.455 93.998,306.248 92.769,304.1 91.435,302.016 90,300" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" /><text x="122.1" y="316.967" fill="#c45a0a" font-size="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">θ</text><line x1="50" y1="330" x2="350" y2="330" stroke="#075ea8" stroke-width="7" /><line x1="350" y1="330" x2="350" y2="105" stroke="#087f8c" stroke-width="7" /><line x1="50" y1="330" x2="350" y2="105" stroke="#c45a0a" stroke-width="7" /><polyline points="330,330 330,310 350,310" fill="none" stroke="#163a5f" stroke-width="3"/><text x="200" y="368" fill="#075ea8" font-size="28" text-anchor="middle" >adj</text><text x="364" y="227.5" fill="#087f8c" font-size="28" >opp</text><text x="120" y="203.5" fill="#c45a0a" font-size="28" >hyp</text><text x="420" y="78" fill="#526579" font-size="24" >know and want</text><text x="640" y="78" fill="#526579" font-size="24" >use</text><text x="420" y="132" fill="#c45a0a" font-size="30" >hyp</text><text x="490" y="132" fill="#163a5f" font-size="30" >&amp;</text><text x="526" y="132" fill="#087f8c" font-size="30" >opp</text><text x="640" y="132" fill="#163a5f" font-size="30" font-weight="700">sin</text><text x="420" y="198" fill="#c45a0a" font-size="30" >hyp</text><text x="490" y="198" fill="#163a5f" font-size="30" >&amp;</text><text x="526" y="198" fill="#075ea8" font-size="30" >adj</text><text x="640" y="198" fill="#163a5f" font-size="30" font-weight="700">cos</text><text x="420" y="264" fill="#075ea8" font-size="30" >adj</text><text x="490" y="264" fill="#163a5f" font-size="30" >&amp;</text><text x="526" y="264" fill="#087f8c" font-size="30" >opp</text><text x="640" y="264" fill="#163a5f" font-size="30" font-weight="700">tan</text><text x="420" y="360" fill="#163a5f" font-size="26" >Unknown on top: multiply.</text><text x="420" y="400" fill="#163a5f" font-size="26" >Unknown on the bottom: divide.</text></g>
</svg>
