<title id="title">Sine and cosine of acute angles</title><desc id="desc">A graph from 0 to 90 degrees. Sine rises from 0 to 1 and cosine falls from 1 to 0. They cross at 45 degrees, where both are about 0.7071. Both stay between 0 and 1 for acute angles.</desc>
