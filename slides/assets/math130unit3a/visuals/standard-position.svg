<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 600" role="img" aria-labelledby="title desc">
<title id="title">Angles in standard position</title><desc id="desc">Coordinate axes with Quadrants I through IV. The vertex is at the origin and the initial side lies on the positive x-axis. An orange arc rotates counterclockwise to a terminal side in Quadrant II, labeled positive. A purple arc rotates clockwise to a terminal side in Quadrant IV, labeled negative.</desc>
