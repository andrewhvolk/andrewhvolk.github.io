<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
<title id="title">Opposite and adjacent depend on the angle</title><desc id="desc">The same right triangle drawn twice. Measured from angle A at the lower left, the bottom leg is adjacent and the vertical leg is opposite. Measured from angle B at the top, the bottom leg is opposite and the vertical leg is adjacent. The hypotenuse does not change.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="40,330 300,330 300,135" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="280,330 280,310 300,310" fill="none" stroke="#163a5f" stroke-width="3"/><polygon points="410,330 670,330 670,135" fill="#fff3e8" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="650,330 650,310 670,310" fill="none" stroke="#163a5f" stroke-width="3"/><polyline points="86,330 85.944,327.724 85.775,325.453 85.494,323.194 85.101,320.951 84.598,318.731 83.986,316.538 83.266,314.378 82.44,312.256 81.51,310.178 80.479,308.149 79.348,306.172 78.121,304.255 76.8,302.4" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" /><text x="108.305" y="318.232" fill="#c45a0a" font-size="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">A</text><polyline points="670,181 667.631,180.939 665.269,180.756 662.919,180.452 660.588,180.027 658.282,179.482 656.007,178.82 653.769,178.041 651.574,177.148 649.428,176.144 647.337,175.03 645.306,173.81 643.34,172.487 641.445,171.064 639.626,169.546 637.887,167.936 636.234,166.239 634.67,164.458 633.2,162.6" fill="none" stroke="#6d3bb5" stroke-width="4" stroke-linejoin="round" /><text x="637.801" y="210.399" fill="#6d3bb5" font-size="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">B</text><text x="170" y="368" fill="#075ea8" font-size="26" text-anchor="middle" >adjacent</text><text x="312" y="240.5" fill="#087f8c" font-size="26" >opposite</text><text x="540" y="368" fill="#087f8c" font-size="26" text-anchor="middle" >opposite</text><text x="682" y="240.5" fill="#075ea8" font-size="26" >adjacent</text><text x="170" y="410" fill="#c45a0a" font-size="28" text-anchor="middle" >from angle A</text><text x="540" y="410" fill="#6d3bb5" font-size="28" text-anchor="middle" >from angle B</text></g>
