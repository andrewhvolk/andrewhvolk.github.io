<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" role="img" aria-labelledby="title desc">
<title id="title">Arc length on a circle</title><desc id="desc">A circle of radius r with a shaded sector. The central angle theta is between two radii, and the orange arc s lies opposite it. The caption reads s equals r theta, theta in radians.</desc>
