<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" role="img" aria-labelledby="title desc">
<title id="title">DMS carrying and valid ranges</title><desc id="desc">If rounding produces 12 degrees 59 minutes 60 seconds, carry the 60 seconds into one minute. Then carry 60 minutes into one degree, obtaining 13 degrees 0 minutes 0 seconds. In normalized DMS, minutes and seconds each lie from zero inclusive to 60 exclusive.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><text x="340" y="60" fill="#163a5f" font-size="32" text-anchor="middle">A carry after rounding</text><text x="340" y="180" fill="#c45a0a" font-size="43" text-anchor="middle">12°59′60″</text><text x="340" y="250" fill="#087f8c" font-size="32" text-anchor="middle">60″ = 1′</text><text x="340" y="326" fill="#c45a0a" font-size="43" text-anchor="middle">12°60′00″</text><text x="340" y="402" fill="#087f8c" font-size="32" text-anchor="middle">60′ = 1°</text><text x="340" y="480" fill="#075ea8" font-size="43" text-anchor="middle">13°00′00″</text><line x1="70" y1="535" x2="610" y2="535" stroke="#cbd5e1"  stroke-width="2"/><text x="340" y="595" fill="#163a5f" font-size="31" text-anchor="middle">0 ≤ minutes &lt; 60</text><text x="340" y="644" fill="#163a5f" font-size="31" text-anchor="middle">0 ≤ seconds &lt; 60</text></g>
</svg>
