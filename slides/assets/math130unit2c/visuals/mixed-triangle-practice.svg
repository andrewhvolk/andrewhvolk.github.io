<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 840" role="img" aria-labelledby="title desc">
<title id="title">Three triangles for independent formula selection</title><desc id="desc">Triangle 1 has base 14 and perpendicular height 5. Triangle 2 has all three sides equal to 6. Triangle 3 has sides 5, 5, and 6, and no height is given. Figures have uniform scales within each triangle and no computed areas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><text x="54" y="32" fill="#163a5f" font-size="28" >1. Base and height</text><polygon points="125,195 433,195 213,85" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="mixed-base-height"/><line x1="213" y1="85" x2="213" y2="195" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><path d="M 213 180 h 15 v 15" fill="none" stroke="#087f8c" stroke-width="3"/><text x="279" y="231" fill="#075ea8" font-size="30" text-anchor="middle">14</text><text x="227" y="147" fill="#087f8c" font-size="30" >5</text><text x="54" y="278" fill="#163a5f" font-size="28" >2. Equal sides</text><polygon points="190,485 406,485 298,297.9385" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="mixed-equilateral"/><text x="196" y="394" fill="#075ea8" font-size="29" >6</text><text x="385" y="394" fill="#075ea8" font-size="29" >6</text><text x="298" y="522" fill="#075ea8" font-size="29" text-anchor="middle">6</text><text x="54" y="575" fill="#163a5f" font-size="28" >3. Three sides</text><polygon points="190,760 406,760 298,616" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="mixed-isosceles"/><text x="196" y="694" fill="#087f8c" font-size="29" >5</text><text x="385" y="694" fill="#c45a0a" font-size="29" >5</text><text x="298" y="801" fill="#075ea8" font-size="29" text-anchor="middle">6</text></g>
</svg>
