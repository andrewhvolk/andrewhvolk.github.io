<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 730" role="img" aria-labelledby="title desc">
<title id="title">Corresponding sides in rotated similar triangles</title><desc id="desc">A right triangle ABC and a larger rotated right triangle DEF are similar. A corresponds to D, B to E, C to F. Blue sides AB and DE correspond, teal sides AC and DF correspond, and orange sides BC and EF correspond. Angle marks confirm the mapping.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="75,350 207,350 75,174" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="similar-small"/><polygon points="649,350 649,152 385,350" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="similar-large"/><line x1="75" y1="350" x2="207" y2="350" stroke="#075ea8"  stroke-width="5"/><line x1="75" y1="350" x2="75" y2="174" stroke="#087f8c"  stroke-width="5"/><line x1="207" y1="350" x2="75" y2="174" stroke="#c45a0a"  stroke-width="5"/><line x1="649" y1="350" x2="649" y2="152" stroke="#075ea8"  stroke-width="5"/><line x1="649" y1="350" x2="385" y2="350" stroke="#087f8c"  stroke-width="5"/><line x1="649" y1="152" x2="385" y2="350" stroke="#c45a0a"  stroke-width="5"/><path d="M 75 334 h 16 v 16" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M 649 333 h -17 v 17" fill="none" stroke="#087f8c" stroke-width="3"/><text x="50" y="382" fill="#163a5f" font-size="30" text-anchor="middle">A</text><text x="229" y="382" fill="#163a5f" font-size="30" text-anchor="middle">B</text><text x="50" y="165" fill="#163a5f" font-size="30" text-anchor="middle">C</text><text x="674" y="382" fill="#163a5f" font-size="30" text-anchor="middle">D</text><text x="674" y="140" fill="#163a5f" font-size="30" text-anchor="middle">E</text><text x="360" y="382" fill="#163a5f" font-size="30" text-anchor="middle">F</text><path d="M 175 350 A 32 32 0 0 1 187.8 324.4" fill="none" stroke="#075ea8" stroke-width="3" /><path d="M 649 184 A 32 32 0 0 1 623.4 171.2" fill="none" stroke="#075ea8" stroke-width="3" /><path d="M 97.8 204.4 A 38 38 0 0 1 75 212" fill="none" stroke="#6d3bb5" stroke-width="3" /><path d="M 102 210 A 45 45 0 0 1 75 219" fill="none" stroke="#6d3bb5" stroke-width="3" /><path d="M 415.4 327.2 A 38 38 0 0 1 423 350" fill="none" stroke="#6d3bb5" stroke-width="3" /><path d="M 421 323 A 45 45 0 0 1 430 350" fill="none" stroke="#6d3bb5" stroke-width="3" /><text x="365" y="471" fill="#163a5f" font-size="38" text-anchor="middle">△ABC ∼ △DEF</text><text x="365" y="528" fill="#163a5f" font-size="29" text-anchor="middle">A ↔ D     B ↔ E     C ↔ F</text><text x="365" y="590" fill="#075ea8" font-size="31" text-anchor="middle">AB ↔ DE</text><text x="365" y="635" fill="#087f8c" font-size="31" text-anchor="middle">AC ↔ DF</text><text x="365" y="680" fill="#c45a0a" font-size="31" text-anchor="middle">BC ↔ EF</text></g>
</svg>
