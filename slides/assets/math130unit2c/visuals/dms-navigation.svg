<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 715" role="img" aria-labelledby="title desc">
<title id="title">DMS subdivisions and nautical distance</title><desc id="desc">One degree contains 60 angular minutes, one minute contains 60 angular seconds, and one second is 1/3600 degree. A schematic Earth meridian arc is magnified to illustrate that one minute of latitude is approximately one nautical mile. A nautical mile is exactly 1852 meters.</desc>
