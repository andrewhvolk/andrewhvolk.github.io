<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 570" role="img" aria-labelledby="title desc">
<title id="title">A Heron model with side lengths five, six, and seven</title><desc id="desc">A non-right triangle has side lengths a equals 5, b equals 6, and c equals 7, drawn with a common scale. No altitude or computed area is shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="120,450 435,450 242.1429,261.0394" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="heron-model-triangle"/><text x="277" y="499" fill="#075ea8" font-size="34" text-anchor="middle">c = 7</text><text x="118" y="352" fill="#087f8c" font-size="32" >a = 5</text><text x="366" y="354" fill="#c45a0a" font-size="32" >b = 6</text><text x="285" y="115" fill="#163a5f" font-size="31" text-anchor="middle">Three sides are known.</text><text x="285" y="170" fill="#526579" font-size="29" text-anchor="middle">No height is given.</text></g>
</svg>
