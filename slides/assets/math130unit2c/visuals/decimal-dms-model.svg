<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 635" role="img" aria-labelledby="title desc">
<title id="title">Decimal degrees to DMS using successive remainders</title><desc id="desc">The angle 135.721 degrees separates into 135 whole degrees and a 0.721 degree remainder. Multiply fractional degrees by 60 for minutes, retain the whole minutes, and multiply only the fractional minutes by 60 for seconds. Computed minutes and seconds are not printed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><text x="330" y="76" fill="#163a5f" font-size="43" text-anchor="middle">135.721°</text><line x1="45" y1="126" x2="615" y2="126" stroke="#cbd5e1"  stroke-width="2"/><text x="170" y="197" fill="#075ea8" font-size="29" text-anchor="middle">135 whole degrees</text><text x="499" y="197" fill="#087f8c" font-size="29" text-anchor="middle">0.721° remainder</text><text x="330" y="286" fill="#087f8c" font-size="34" text-anchor="middle">Fractional degrees × 60</text><text x="330" y="336" fill="#163a5f" font-size="28" text-anchor="middle">Keep the whole minutes.</text><text x="330" y="436" fill="#c45a0a" font-size="34" text-anchor="middle">Fractional minutes × 60</text><text x="330" y="486" fill="#163a5f" font-size="28" text-anchor="middle">The result is seconds.</text><text x="330" y="588" fill="#526579" font-size="26" text-anchor="middle">Only the remainder passes to the next unit.</text></g>
</svg>
