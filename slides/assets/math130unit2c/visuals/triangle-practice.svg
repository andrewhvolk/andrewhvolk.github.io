<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 740" role="img" aria-labelledby="title desc">
<title id="title">Two triangle area practice figures</title><desc id="desc">The first triangle has side lengths 7, 8, and 9 drawn proportionally, with no right-angle mark. The second is a right triangle with base 9, hypotenuse 15, and unknown perpendicular height h. Answers are absent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><text x="60" y="35" fill="#163a5f" font-size="29" >1. Three given sides</text><polygon points="120,275 399,275 233.6667,90.1517" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="heron-triangle"/><text x="260" y="316" fill="#075ea8" font-size="31" text-anchor="middle">9</text><text x="130" y="170" fill="#087f8c" font-size="31" >7</text><text x="335" y="160" fill="#c45a0a" font-size="31" >8</text><text x="60" y="362" fill="#163a5f" font-size="29" >2. A right triangle</text><polygon points="190,650 388,650 190,386" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="practice-right-triangle"/><path d="M 190 631 h 19 v 19" fill="none" stroke="#087f8c" stroke-width="3"/><text x="290" y="692" fill="#075ea8" font-size="31" text-anchor="middle">9</text><text x="100" y="535" fill="#087f8c" font-size="31" >h = ?</text><text x="310" y="505" fill="#c45a0a" font-size="31" >15</text></g>
</svg>
