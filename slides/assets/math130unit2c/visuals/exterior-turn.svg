<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 620" role="img" aria-labelledby="title desc">
<title id="title">Exterior angles of a convex pentagon</title><desc id="desc">Five exterior turns, measured between an extended incoming side and the outgoing side, accompany one clockwise circuit of a convex pentagon.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="355,130 516.6796,247.4671 454.9235,437.5329 255.0765,437.5329 193.3204,247.4671" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="turn-polygon"/><line x1="355" y1="130" x2="413.2492" y2="87.6795" stroke="#526579" stroke-width="4" stroke-dasharray="9 7"/><path d="M 388.9787 105.313 A 42 42 0 0 1 388.9787 154.687" fill="none" stroke="#c45a0a" stroke-width="3" /><line x1="409.9711" y1="169.9388" x2="448.7742" y2="198.1309" stroke="#163a5f" stroke-width="4" marker-end="url(#arrow)"/><text x="433" y="138" fill="#c45a0a" font-size="28" text-anchor="middle">e₁</text><line x1="516.6796" y1="247.4671" x2="574.9288" y2="289.7876" stroke="#526579" stroke-width="4" stroke-dasharray="9 7"/><path d="M 550.6583 272.1541 A 42 42 0 0 1 503.7009 287.4115" fill="none" stroke="#c45a0a" stroke-width="3" /><line x1="495.6825" y1="312.0895" x2="480.8611" y2="357.7053" stroke="#163a5f" stroke-width="4" marker-end="url(#arrow)"/><text x="540.7829" y="329.6495" fill="#c45a0a" font-size="28" text-anchor="middle">e₂</text><line x1="454.9235" y1="437.5329" x2="432.6743" y2="506.009" stroke="#526579" stroke-width="4" stroke-dasharray="9 7"/><path d="M 441.9448 477.4773 A 42 42 0 0 1 412.9235 437.5329" fill="none" stroke="#c45a0a" stroke-width="3" /><line x1="386.9755" y1="437.5329" x2="339.0122" y2="437.5329" stroke="#163a5f" stroke-width="4" marker-end="url(#arrow)"/><text x="391.8202" y="491.3801" fill="#c45a0a" font-size="28" text-anchor="middle">e₃</text><line x1="255.0765" y1="437.5329" x2="183.0765" y2="437.5329" stroke="#526579" stroke-width="4" stroke-dasharray="9 7"/><path d="M 213.0765 437.5329 A 42 42 0 0 1 242.0978 397.5885" fill="none" stroke="#c45a0a" stroke-width="3" /><line x1="234.0794" y1="372.9105" x2="219.258" y2="327.2947" stroke="#163a5f" stroke-width="4" marker-end="url(#arrow)"/><text x="191.9732" y="399.6856" fill="#c45a0a" font-size="28" text-anchor="middle">e₄</text><line x1="193.3204" y1="247.4671" x2="171.0712" y2="178.991" stroke="#526579" stroke-width="4" stroke-dasharray="9 7"/><path d="M 180.3417 207.5227 A 42 42 0 0 1 227.2991 222.7801" fill="none" stroke="#c45a0a" stroke-width="3" /><line x1="248.2915" y1="207.5283" x2="287.0946" y2="179.3362" stroke="#163a5f" stroke-width="4" marker-end="url(#arrow)"/><text x="217.4237" y="181.2847" fill="#c45a0a" font-size="28" text-anchor="middle">e₅</text><text x="355" y="290" fill="#163a5f" font-size="29" text-anchor="middle">Follow the boundary</text><text x="355" y="330" fill="#163a5f" font-size="29" text-anchor="middle">in one direction</text><text x="355" y="575" fill="#526579" font-size="27" text-anchor="middle">Each orange arc measures an exterior turn.</text></g>
</svg>
