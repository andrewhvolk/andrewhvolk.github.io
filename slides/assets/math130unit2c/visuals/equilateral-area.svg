<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 710" role="img" aria-labelledby="title desc">
<title id="title">An equilateral triangle with side 1600 kilometers</title><desc id="desc">A geometrically equilateral triangle has three sides of 1600 kilometers. A dashed perpendicular altitude bisects the base into two 800 kilometer segments. The altitude is labeled h, not precomputed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="115,535 555,535 335,153.9488" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="equilateral-triangle"/><line x1="335" y1="153.9488" x2="335" y2="535" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7" id="equilateral-altitude"/><path d="M 335 514 h 21 v 21" fill="none" stroke="#087f8c" stroke-width="3"/><text x="335" y="590" fill="#075ea8" font-size="33" text-anchor="middle">1600 km</text><text x="170" y="400" fill="#075ea8" font-size="30" transform="rotate(-60 170 400)">1600 km</text><text x="435" y="252" fill="#075ea8" font-size="30" transform="rotate(60 435 252)">1600 km</text><text x="225" y="518" fill="#526579" font-size="28" text-anchor="middle">800</text><text x="445" y="518" fill="#526579" font-size="28" text-anchor="middle">800</text><text x="351" y="350" fill="#087f8c" font-size="34" >h</text><text x="335" y="660" fill="#163a5f" font-size="29" text-anchor="middle">The altitude bisects the base.</text></g>
</svg>
