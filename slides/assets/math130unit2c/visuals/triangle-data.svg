<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 650" role="img" aria-labelledby="title desc">
<title id="title">Information for four triangle methods</title><desc id="desc">The first triangle labels a base b and a perpendicular height h. The second labels perpendicular legs a and b and hypotenuse c with a right-angle mark. The third labels three side lengths a, b, c. The fourth has three equal sides s with matching tick marks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><text x="205" y="38" fill="#163a5f" font-size="28" text-anchor="middle">Base and height</text><text x="570" y="38" fill="#163a5f" font-size="28" text-anchor="middle">Right triangle</text><polygon points="65,225 315,225 160,75" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" /><line x1="160" y1="75" x2="160" y2="225" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><path d="M 160 210 h 15 v 15" fill="none" stroke="#087f8c" stroke-width="3"/><text x="190" y="260" fill="#075ea8" font-size="29" text-anchor="middle">b</text><text x="175" y="155" fill="#087f8c" font-size="29" >h</text><polygon points="455,225 680,225 455,90" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" /><path d="M 455 209 h 16 v 16" fill="none" stroke="#087f8c" stroke-width="3"/><text x="565" y="260" fill="#075ea8" font-size="29" text-anchor="middle">a</text><text x="425" y="163" fill="#087f8c" font-size="29" >b</text><text x="580" y="135" fill="#c45a0a" font-size="29" >c</text><text x="205" y="355" fill="#163a5f" font-size="28" text-anchor="middle">Three sides</text><text x="570" y="355" fill="#163a5f" font-size="28" text-anchor="middle">Equilateral</text><polygon points="70,560 310,560 154,400" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" /><text x="190" y="599" fill="#075ea8" font-size="29" text-anchor="middle">c</text><text x="72" y="472" fill="#087f8c" font-size="29" >b</text><text x="253" y="472" fill="#c45a0a" font-size="29" >a</text><polygon points="465,560 665,560 565,386.7949" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" /><text x="565" y="599" fill="#075ea8" font-size="29" text-anchor="middle">s</text><text x="485" y="470" fill="#075ea8" font-size="29" >s</text><text x="632" y="470" fill="#075ea8" font-size="29" >s</text><line x1="508.5" y1="469.6" x2="521.5" y2="477.2" stroke="#163a5f" stroke-width="4" /><line x1="608.5" y1="477.2" x2="621.5" y2="469.6" stroke="#163a5f" stroke-width="4" /><line x1="565" y1="551" x2="565" y2="569" stroke="#163a5f" stroke-width="4" /></g>
</svg>
