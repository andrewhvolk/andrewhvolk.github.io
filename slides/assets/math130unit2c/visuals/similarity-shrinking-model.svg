<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 580" role="img" aria-labelledby="title desc">
<title id="title">A multipart shrinking similarity model</title><desc id="desc">Triangle ABC has exact sides AB equals 15, AC equals 13, and BC equals 14. Angle A is approximately 59.5 degrees and angle B approximately 53.1 degrees, rounded to a tenth. The rotated similar triangle DEF has DE equals 10, while DF and EF are unknown. The target is a uniform two-thirds scale of the source.</desc>
