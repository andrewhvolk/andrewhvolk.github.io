<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 690" role="img" aria-labelledby="title desc">
<title id="title">Height and slanted side in an obtuse triangle</title><desc id="desc">An obtuse triangle has base 10 and perpendicular height 12. Its 13-unit slanted side joins the right end of the base to the opposite vertex. The altitude meets the extended base outside the triangle. No area answer is printed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="100,500 400,500 550,140" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="obtuse-triangle"/><line x1="400" y1="500" x2="550" y2="500" stroke="#526579" stroke-width="4" stroke-dasharray="9 7"/><line x1="550" y1="140" x2="550" y2="500" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7" id="external-altitude"/><path d="M 550 480 h 20 v 20" fill="none" stroke="#087f8c" stroke-width="3"/><text x="250" y="544" fill="#075ea8" font-size="32" text-anchor="middle">b = 10</text><text x="570" y="330" fill="#087f8c" font-size="31" >h = 12</text><text x="428" y="295" fill="#c45a0a" font-size="32" >13</text><text x="350" y="628" fill="#163a5f" font-size="29" text-anchor="middle">The altitude is outside the triangle.</text></g>
</svg>
