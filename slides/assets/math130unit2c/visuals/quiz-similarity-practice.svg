<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" role="img" aria-labelledby="title desc">
<title id="title">An independent multipart similarity problem</title><desc id="desc">A right triangle ABC has AB equals 12, AC equals 5, BC equals 13, and angle B approximately 22.6 degrees. A rotated similar triangle DEF has DE equals 21. Students must find corresponding angles E and F and sides DF and EF. No requested values are displayed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="70,300 262,300 70,220" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="quiz-similarity-source"/><polygon points="590,390 590,54 450,390" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="quiz-similarity-target"/><line x1="70" y1="300" x2="262" y2="300" stroke="#075ea8" stroke-width="4" /><line x1="70" y1="300" x2="70" y2="220" stroke="#087f8c" stroke-width="4" /><line x1="262" y1="300" x2="70" y2="220" stroke="#c45a0a" stroke-width="4" /><line x1="590" y1="390" x2="590" y2="54" stroke="#075ea8" stroke-width="4" /><line x1="590" y1="390" x2="450" y2="390" stroke="#087f8c" stroke-width="4" /><line x1="590" y1="54" x2="450" y2="390" stroke="#c45a0a" stroke-width="4" /><path d="M 70 286 h 14 v 14" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M 590 374 h -16 v 16" fill="none" stroke="#087f8c" stroke-width="3"/><text x="48" y="331" fill="#163a5f" font-size="28" text-anchor="middle">A</text><text x="281" y="331" fill="#163a5f" font-size="28" text-anchor="middle">B</text><text x="48" y="214" fill="#163a5f" font-size="28" text-anchor="middle">C</text><text x="611" y="421" fill="#163a5f" font-size="28" text-anchor="middle">D</text><text x="611" y="48" fill="#163a5f" font-size="28" text-anchor="middle">E</text><text x="427" y="422" fill="#163a5f" font-size="28" text-anchor="middle">F</text><text x="166" y="344" fill="#075ea8" font-size="31" text-anchor="middle">12</text><text x="33" y="275" fill="#087f8c" font-size="30" >5</text><text x="164" y="247" fill="#c45a0a" font-size="30" >13</text><text x="611" y="231" fill="#075ea8" font-size="32" >21</text><text x="160" y="283" fill="#163a5f" font-size="24" >≈ 22.6°</text><text x="477" y="215" fill="#c45a0a" font-size="34" >?</text><text x="520" y="430" fill="#087f8c" font-size="34" text-anchor="middle">?</text><text x="350" y="489" fill="#163a5f" font-size="34" text-anchor="middle">△ABC ∼ △DEF</text></g>
</svg>
