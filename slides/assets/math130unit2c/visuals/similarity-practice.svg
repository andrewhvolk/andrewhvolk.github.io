"140" y="419" fill="#075ea8" font-size="32" text-anchor="middle">14</text><text x="669" y="272" fill="#075ea8" font-size="32" >?</text><text x="365" y="468" fill="#163a5f" font-size="28" text-anchor="middle">larger length = smaller length × 3/2</text><line x1="50" y1="503" x2="680" y2="503" stroke="#cbd5e1"  stroke-width="2"/><text x="365" y="554" fill="#163a5f" font-size="38" text-anchor="middle">73.625°</text><text x="175" y="620" fill="#075ea8" font-size="28" text-anchor="middle">73 whole degrees</text><text x="540" y="620" fill="#087f8c" font-size="28" text-anchor="middle">0.625 of a degree</text><text x="365" y="675" fill="#526579" font-size="27" text-anchor="middle">Convert the fractional part to minutes.</text></g>
