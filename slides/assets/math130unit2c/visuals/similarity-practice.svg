<title id="title">Scale factor and decimal degrees practice</title><desc id="desc">The smaller similar triangle has blue side AB equal to 14 and the rotated larger triangle has corresponding blue side DE labeled question mark. The scale factor is 3/2. The angle 73.625 degrees is separated into 73 whole degrees and 0.625 of a degree. The answers are not displayed.</desc>
