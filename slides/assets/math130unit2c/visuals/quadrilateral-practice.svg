<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 710" role="img" aria-labelledby="title desc">
<title id="title">Independent parallelogram and trapezoid area problems</title><desc id="desc">The first figure has base 11, perpendicular height 4, and slanted side 5. The second has parallel bases 6 and 12 with perpendicular height 4. All lengths are in meters. Neither area is displayed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><text x="65" y="50" fill="#163a5f" font-size="31" >1. Parallelogram</text><polygon points="120,260 450,260 540,140 210,140" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="area-practice-parallelogram"/><line x1="210" y1="140" x2="210" y2="260" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><path d="M 210 244 h 16 v 16" fill="none" stroke="#087f8c" stroke-width="3"/><text x="285" y="302" fill="#075ea8" font-size="31" text-anchor="middle">b = 11</text><text x="226" y="209" fill="#087f8c" font-size="30" >h = 4</text><text x="145" y="196" fill="#c45a0a" font-size="29" >5</text><text x="65" y="405" fill="#163a5f" font-size="31" >2. Trapezoid</text><polygon points="150,610 450,610 375,510 225,510" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="area-practice-trapezoid"/><line x1="225" y1="510" x2="225" y2="610" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><path d="M 225 594 h 16 v 16" fill="none" stroke="#087f8c" stroke-width="3"/><text x="300" y="490" fill="#075ea8" font-size="30" text-anchor="middle">b₁ = 6</text><text x="300" y="658" fill="#075ea8" font-size="30" text-anchor="middle">b₂ = 12</text><text x="242" y="570" fill="#087f8c" font-size="29" >h = 4</text></g>
</svg>
