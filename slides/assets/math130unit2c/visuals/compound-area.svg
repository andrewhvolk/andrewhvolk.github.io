<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" role="img" aria-labelledby="title desc">
<title id="title">Compound area practice with a rectangular hole</title><desc id="desc">An L-shaped region fits inside a 15 by 10 meter rectangle. A bottom-right cutout is 5 by 4 meters and an interior rectangular hole is 3 by 2 meters. A dashed line shows one possible partition. The shaded area is not provided.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="100,160 520,160 520,328 380,328 380,440 100,440" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="compound-outline"/><line x1="100" y1="328" x2="380" y2="328" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><rect id="compound-hole" x="180" y="216" width="84" height="56" fill="#f8fafc" stroke="#c45a0a" stroke-width="4" stroke-dasharray="8 5"/><text x="310" y="125" fill="#075ea8" font-size="32" text-anchor="middle">15 m</text><text x="30" y="313" fill="#075ea8" font-size="30" >10 m</text><text x="450" y="308" fill="#c45a0a" font-size="30" text-anchor="middle">5 m</text><text x="397" y="398" fill="#c45a0a" font-size="30" >4 m</text><text x="222" y="200" fill="#c45a0a" font-size="27" text-anchor="middle">3 m</text><text x="277" y="255" fill="#c45a0a" font-size="27" >2 m</text><text x="222" y="255" fill="#c45a0a" font-size="23" text-anchor="middle">hole</text><text x="310" y="545" fill="#163a5f" font-size="32" text-anchor="middle">Find the shaded area.</text></g>
</svg>
