<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 695" role="img" aria-labelledby="title desc">
<title id="title">A right-triangle height and area model</title><desc id="desc">A right triangle has base 8, hypotenuse 17, and unknown perpendicular height h. Its sides are drawn proportionally. No height or area answer is printed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="160,515 400,515 160,65" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="right-area-model-triangle"/><path d="M 160 492 h 23 v 23" fill="none" stroke="#087f8c" stroke-width="3"/><text x="280" y="569" fill="#075ea8" font-size="33" text-anchor="middle">base = 8</text><text x="47" y="299" fill="#087f8c" font-size="33" >h = ?</text><text x="316" y="255" fill="#c45a0a" font-size="34" >17</text><text x="275" y="641" fill="#526579" font-size="25" text-anchor="middle">The right-angle mark identifies the legs.</text></g>
</svg>
