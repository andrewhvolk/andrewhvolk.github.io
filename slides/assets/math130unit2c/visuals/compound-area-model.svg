<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" role="img" aria-labelledby="title desc">
<title id="title">A numerical compound-area model</title><desc id="desc">The outside bounding rectangle is 12 by 8 meters. A bottom-right cutout is 4 by 3 meters. An interior rectangular hole is 2 by 1 meter. The cutout and hole are separate regions, each subtracted once.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="100,150 460,150 460,300 340,300 340,390 100,390" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="compound-model-outline"/><line x1="100" y1="300" x2="340" y2="300" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><rect id="compound-model-hole" x="175" y="195" width="60" height="30" fill="#f8fafc" stroke="#c45a0a" stroke-width="4"/><text x="280" y="113" fill="#075ea8" font-size="32" text-anchor="middle">12 m</text><text x="25" y="280" fill="#075ea8" font-size="30" >8 m</text><text x="400" y="282" fill="#c45a0a" font-size="29" text-anchor="middle">4 m</text><text x="357" y="354" fill="#c45a0a" font-size="29" >3 m</text><text x="205" y="179" fill="#c45a0a" font-size="27" text-anchor="middle">2 m</text><text x="248" y="222" fill="#c45a0a" font-size="27" >1 m</text><text x="295" y="490" fill="#163a5f" font-size="28" text-anchor="middle">Outer rectangle − cutout − hole</text></g>
</svg>
