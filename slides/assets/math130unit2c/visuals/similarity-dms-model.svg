<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 705" role="img" aria-labelledby="title desc">
<title id="title">Given similarity lengths and DMS place values</title><desc id="desc">The similar triangles label AB as 6, DE as 9, BC as 10, and EF as x. The second visual separates 45 degrees, 22 minutes, and 18 seconds and shows divisors 60 for minutes and 3600 for seconds when converting to degrees. The answer for x is not printed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="75,335 207,335 75,159" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="similar-small"/><polygon points="649,335 649,137 385,335" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="similar-large"/><line x1="75" y1="335" x2="207" y2="335" stroke="#075ea8"  stroke-width="5"/><line x1="75" y1="335" x2="75" y2="159" stroke="#087f8c"  stroke-width="5"/><line x1="207" y1="335" x2="75" y2="159" stroke="#c45a0a"  stroke-width="5"/><line x1="649" y1="335" x2="649" y2="137" stroke="#075ea8"  stroke-width="5"/><line x1="649" y1="335" x2="385" y2="335" stroke="#087f8c"  stroke-width="5"/><line x1="649" y1="137" x2="385" y2="335" stroke="#c45a0a"  stroke-width="5"/><path d="M 75 319 h 16 v 16" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M 649 318 h -17 v 17" fill="none" stroke="#087f8c" stroke-width="3"/><text x="50" y="367" fill="#163a5f" font-size="30" text-anchor="middle">A</text><text x="229" y="367" fill="#163a5f" font-size="30" text-anchor="middle">B</text><text x="50" y="150" fill="#163a5f" font-size="30" text-anchor="middle">C</text><text x="674" y="367" fill="#163a5f" font-size="30" text-anchor="middle">D</text><text x="674" y="125" fill="#163a5f" font-size="30" text-anchor="middle">E</text><text x="360" y="367" fill="#163a5f" font-size="30" text-anchor="middle">F</text><path d="M 175 335 A 32 32 0 0 1 187.8 309.4" fill="none" stroke="#075ea8" stroke-width="3" /><path d="M 649 169 A 32 32 0 0 1 623.4 156.2" fill="none" stroke="#075ea8" stroke-width="3" /><path d="M 97.8 189.4 A 38 38 0 0 1 75 197" fill="none" stroke="#6d3bb5" stroke-width="3" /><path d="M 102 195 A 45 45 0 0 1 75 204" fill="none" stroke="#6d3bb5" stroke-width="3" /><path d="M 415.4 312.2 A 38 38 0 0 1 423 335" fill="none" stroke="#6d3bb5" stroke-width="3" /><path d="M 421 308 A 45 45 0 0 1 430 335" fill="none" stroke="#6d3bb5" stroke-width="3" /><text x="140" y="404" fill="#075ea8" font-size="32" text-anchor="middle">6</text><text x="669" y="257" fill="#075ea8" font-size="32" >9</text><text x="161" y="231" fill="#c45a0a" font-size="32" >10</text><text x="500" y="219" fill="#c45a0a" font-size="32" >x</text><text x="365" y="444" fill="#163a5f" font-size="31" text-anchor="middle">AB/DE = BC/EF</text><line x1="50" y1="482" x2="680" y2="482" stroke="#cbd5e1"  stroke-width="2"/><text x="365" y="536" fill="#163a5f" font-size="38" text-anchor="middle">45°22′18″</text><text x="120" y="604" fill="#075ea8" font-size="33" text-anchor="middle">45°</text><text x="365" y="604" fill="#087f8c" font-size="33" text-anchor="middle">22′</text><text x="600" y="604" fill="#c45a0a" font-size="33" text-anchor="middle">18″</text><text x="120" y="655" fill="#075ea8" font-size="26" text-anchor="middle">degrees</text><text x="365" y="655" fill="#087f8c" font-size="29" text-anchor="middle">÷ 60</text><text x="600" y="655" fill="#c45a0a" font-size="29" text-anchor="middle">÷ 3600</text></g>
