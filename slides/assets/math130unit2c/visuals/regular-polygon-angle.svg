<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="title desc">
<title id="title">A local view of the regular polygon's vertex</title><desc id="desc">The incoming side extends horizontally through the vertex. The outgoing side turns 24 degrees. The adjacent interior angle is labeled i equals question mark. The complete polygon and its number of sides are intentionally not shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><path d="M 380 300 L 130 300 L 622.0895 192.2148 Z" fill="#eaf3fb"/><line x1="60" y1="300" x2="380" y2="300" stroke="#163a5f" stroke-width="4" id="incoming-side"/><line x1="380" y1="300" x2="622.0895" y2="192.2148" stroke="#163a5f" stroke-width="4" id="outgoing-side"/><line x1="380" y1="300" x2="650" y2="300" stroke="#526579" stroke-width="4" stroke-dasharray="9 7" id="side-extension"/><path d="M 478.6629 256.0724 A 108 108 0 0 1 488 300" fill="none" stroke="#c45a0a" stroke-width="3" /><path d="M 315 300 A 65 65 0 0 1 439.3805 273.5621" fill="none" stroke="#075ea8" stroke-width="3" /><text x="500" y="280" fill="#c45a0a" font-size="34" >24°</text><text x="298" y="251" fill="#075ea8" font-size="34" >i = ?</text><circle cx="380" cy="300" r="6" fill="#163a5f"/><text x="360" y="415" fill="#163a5f" font-size="29" text-anchor="middle">The interior and exterior angles</text><text x="360" y="456" fill="#163a5f" font-size="29" text-anchor="middle">share a straight line.</text></g>
</svg>
