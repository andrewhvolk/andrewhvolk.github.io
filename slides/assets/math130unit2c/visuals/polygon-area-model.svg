<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 710" role="img" aria-labelledby="title desc">
<title id="title">Octagon and two area models</title><desc id="desc">An octagon has eight sides. A trapezoid has parallel bases 12 and 20 and perpendicular height 7. A parallelogram has base 9 and perpendicular height 8. Heights have right-angle marks.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#163a5f" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><polygon points="118.2122,45.3284 171.7878,45.3284 209.6716,83.2122" fill="#eaf3fb"  stroke-width="4" stroke-linejoin="round" stroke="none"/><polygon points="118.2122,45.3284 209.6716,83.2122 209.6716,136.7878" fill="#e4f4f5"  stroke-width="4" stroke-linejoin="round" stroke="none"/><polygon points="118.2122,45.3284 209.6716,136.7878 171.7878,174.6716" fill="#eaf3fb"  stroke-width="4" stroke-linejoin="round" stroke="none"/><polygon points="118.2122,45.3284 171.7878,174.6716 118.2122,174.6716" fill="#e4f4f5"  stroke-width="4" stroke-linejoin="round" stroke="none"/><polygon points="118.2122,45.3284 118.2122,174.6716 80.3284,136.7878" fill="#eaf3fb"  stroke-width="4" stroke-linejoin="round" stroke="none"/><polygon points="118.2122,45.3284 80.3284,136.7878 80.3284,83.2122" fill="#e4f4f5"  stroke-width="4" stroke-linejoin="round" stroke="none"/><polygon points="118.2122,45.3284 171.7878,45.3284 209.6716,83.2122 209.6716,136.7878 171.7878,174.6716 118.2122,174.6716 80.3284,136.7878 80.3284,83.2122" fill="none" stroke="#163a5f" stroke-width="4" id="model-octagon"/><line x1="118.2122" y1="45.3284" x2="209.6716" y2="83.2122" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7" data-diagonal="true"/><line x1="118.2122" y1="45.3284" x2="209.6716" y2="136.7878" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7" data-diagonal="true"/><line x1="118.2122" y1="45.3284" x2="171.7878" y2="174.6716" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7" data-diagonal="true"/><line x1="118.2122" y1="45.3284" x2="118.2122" y2="174.6716" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7" data-diagonal="true"/><line x1="118.2122" y1="45.3284" x2="80.3284" y2="136.7878" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7" data-diagonal="true"/><text x="265" y="105" fill="#163a5f" font-size="32" >Octagon</text><text x="265" y="146" fill="#075ea8" font-size="30" >n = 8</text><polygon points="110,370 510,370 430,230 190,230" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="model-trapezoid"/><line x1="190" y1="230" x2="190" y2="370" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><path d="M 190 352 h 18 v 18" fill="none" stroke="#087f8c" stroke-width="3"/><text x="310" y="213" fill="#075ea8" font-size="29" text-anchor="middle">b₁ = 12</text><text x="310" y="412" fill="#075ea8" font-size="29" text-anchor="middle">b₂ = 20</text><text x="205" y="307" fill="#087f8c" font-size="29" >h = 7</text><polygon points="160,635 340,635 440,475 260,475" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" id="model-parallelogram"/><line x1="260" y1="475" x2="260" y2="635" stroke="#087f8c" stroke-width="4" stroke-dasharray="9 7"/><path d="M 260 617 h 18 v 18" fill="none" stroke="#087f8c" stroke-width="3"/><text x="250" y="675" fill="#075ea8" font-size="29" text-anchor="middle">b = 9</text><text x="275" y="559" fill="#087f8c" font-size="29" >h = 8</text></g>
