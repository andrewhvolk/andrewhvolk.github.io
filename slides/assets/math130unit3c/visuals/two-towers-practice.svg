<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Two observations 60 feet apart</title><desc id="desc">A building of unknown height h seen from two points 60 feet apart. From the far point the angle of elevation is 27 degrees; from the near point, d feet from the base, it is 48 degrees. Drawn to scale.</desc>
