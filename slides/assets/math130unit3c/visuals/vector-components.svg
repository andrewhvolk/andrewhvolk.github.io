<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">A displacement and its components</title><desc id="desc">An orange arrow 300 miles long points 25 degrees north of east. A blue arrow along the east axis, about 271.89 miles, and a teal arrow north, about 126.79 miles, complete a right triangle. Drawn to scale.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><line x1="40" y1="400" x2="740" y2="400" stroke="#cbd5e1" stroke-width="3" /><line x1="90" y1="470" x2="90" y2="60" stroke="#cbd5e1" stroke-width="3" /><text x="720" y="388" fill="#526579" font-size="24" >E</text><text x="100" y="76" fill="#526579" font-size="24" >N</text><line x1="90" y1="400" x2="525.028" y2="400" stroke="#075ea8" stroke-width="6" marker-end="url(#arrow-blue)"/><line x1="525.028" y1="400" x2="525.028" y2="197.143" stroke="#087f8c" stroke-width="6" marker-end="url(#arrow-teal)"/><line x1="90" y1="400" x2="525.028" y2="197.143" stroke="#c45a0a" stroke-width="8" marker-end="url(#arrow-orange)"/><polyline points="505.028,400 505.028,380 525.028,380" fill="none" stroke="#163a5f" stroke-width="3"/><polyline points="200,400 199.927,396.001 199.709,392.008 199.346,388.025 198.839,384.057 198.187,380.111 197.393,376.192 196.456,372.303 195.379,368.452 194.162,364.642 192.808,360.878 191.318,357.167 189.694,353.512" fill="none" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" /><text x="222.776" y="381.564" fill="#163a5f" font-size="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">25°</text><text x="307.514" y="440" fill="#075ea8" font-size="24" text-anchor="middle" >east: 300 cos 25° ≈ 271.89 mi</text><text x="539.028" y="306.572" fill="#087f8c" font-size="24" >north ≈ 126.79 mi</text><text x="157.514" y="276.572" fill="#c45a0a" font-size="28" >300 mi</text></g>
</svg>
