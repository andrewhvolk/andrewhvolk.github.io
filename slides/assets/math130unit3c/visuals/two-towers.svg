<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Two observations of one tower</title><desc id="desc">A tower of height h seen from two points 50 feet apart. From the far point the angle of elevation is 31 degrees; from the near point, d feet from the base, it is 53 degrees. Drawn to scale.</desc>
