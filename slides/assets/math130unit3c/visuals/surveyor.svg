<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><rect x="456.502" y="70" width="90" height="330" fill="#e2e8f0" stroke="#526579" stroke-width="3"/><polygon points="90,400 456.502,400 456.502,70" fill="#e4f4f5" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="434.502,400 434.502,378 456.502,378" fill="none" stroke="#163a5f" stroke-width="3"/><line x1="90" y1="400" x2="456.502" y2="70" stroke="#c45a0a" stroke-width="4" stroke-dasharray="10 8"/><polyline points="170,400 169.89,395.813 169.562,391.638 169.015,387.485 168.252,383.367 167.274,379.294 166.085,375.279 164.686,371.331 163.084,367.461 161.281,363.681 159.282,360 157.094,356.429 154.721,352.977 152.172,349.654 149.452,346.47" fill="none" stroke="#163a5f" stroke-width="4" stroke-linejoin="round" /><text x="188.96" y="373.013" fill="#163a5f" font-size="28" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic">42°</text><text x="273.251" y="444" fill="#163a5f" font-size="30" text-anchor="middle" >80 ft</text><text x="412.502" y="245" fill="#087f8c" font-size="36" font-family="Georgia, 'Times New Roman', serif" font-style="italic">h</text><text x="50" y="444" fill="#526579" font-size="22" >surveyor</text></g>
