<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Angle of elevation to a building</title><desc id="desc">A surveyor stands 80 feet from a building and sights the top at a 42 degree angle of elevation. The building height h is unknown. Drawn to scale.</desc>
