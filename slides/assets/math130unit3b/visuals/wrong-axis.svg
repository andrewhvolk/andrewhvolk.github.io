<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" role="img" aria-labelledby="title desc"><title id="title">A reference-angle misconception</title><desc id="desc">Equal-scale axes show a 150 degree terminal side in Quadrant II. An orange 60 degree arc runs from the positive y-axis to the terminal side and is labeled with a question mark. Students must explain why measuring from the y-axis does not give the reference angle.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#075ea8"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c45a0a"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round"><line x1="100" y1="270" x2="480" y2="270" stroke="#cbd5e1" stroke-width="2" /><line x1="290" y1="80" x2="290" y2="460" stroke="#cbd5e1" stroke-width="2" /><text x="470" y="258" fill="#526579" font-size="22" >x</text><text x="302" y="92" fill="#526579" font-size="22" >y</text><line x1="290" y1="270" x2="464.8" y2="270" stroke="#075ea8" stroke-width="4" /><line x1="290" y1="270" x2="148.4914" y2="188.3" stroke="#087f8c" stroke-width="5" id="diagnose-ray" data-degrees="150"/><circle cx="148.4914" cy="188.3" r="6" fill="#087f8c"/><polyline id="diagnose-rotation" data-start="0" data-end="150" points="358.4,270 358.3063,266.4202 358.0253,262.8503 357.5579,259.2999 356.9053,255.7788 356.0693,252.2968 355.0523,248.8632 353.8569,245.4876 352.4865,242.1792 350.9448,238.947 349.2361,235.8 347.3651,232.7467 345.3368,229.7955 343.1568,226.9545 340.8311,224.2315 338.3661,221.6339 335.7685,219.1689 333.0455,216.8432 330.2045,214.6632 327.2533,212.6349 324.2,210.7639 321.053,209.0552 317.8208,207.5135 314.5124,206.1431 311.1368,204.9477 307.7032,203.9307 304.2212,203.0947 300.7001,202.4421 297.1497,201.9747 293.5798,201.6937 290,201.6 286.4202,201.6937 282.8503,201.9747 279.2999,202.4421 275.7788,203.0947 272.2968,203.9307 268.8632,204.9477 265.4876,206.1431 262.1792,207.5135 258.947,209.0552 255.8,210.7639 252.7467,212.6349 249.7955,214.6632 246.9545,216.8432 244.2315,219.1689 241.6339,221.6339 239.1689,224.2315 236.8432,226.9545 234.6632,229.7955 232.6349,232.7467 230.7639,235.8" fill="none" stroke="#075ea8" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="100" y="62" fill="#163a5f" font-size="26" font-weight="700">Which axis defines α?</text><polyline id="wrong-axis" data-start="90" data-end="150" points="290,145 283.458,145.1713 276.9339,145.6848 270.4457,146.539 264.011,147.7315 257.6476,149.2593 251.3729,151.1179 245.204,153.3024 239.1579,155.8068 233.2512,158.6242 227.5,161.7468 221.9201,165.1662 216.5268,168.8729 211.335,172.8568 206.3587,177.1069 201.6117,181.6117 197.1069,186.3587 192.8568,191.335 188.8729,196.5268 185.1662,201.9201 181.7468,207.5" fill="none" stroke="#c45a0a" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-orange)"/><text x="150" y="115" fill="#c45a0a" font-size="28" >60°?</text><text x="45" y="475" fill="#526579" font-size="23" >Explain the error before checking the rule.</text></g></svg>
