<title id="title">Solving sine theta equals negative root 2 over 2</title><desc id="desc">A unit circle with a dashed horizontal line at y equals negative root 2 over 2. It crosses the circle at two points, on terminal sides at 225 degrees in Quadrant III and 315 degrees in Quadrant IV. Each makes a 45 degree reference angle with the x-axis.</desc>
