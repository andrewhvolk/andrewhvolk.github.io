<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540" role="img" aria-labelledby="title desc"><title id="title">Two unit-circle intersections for a negative sine value</title><desc id="desc">A unit circle on equal-scale axes intersects the horizontal line y=-0.848 twice, in Quadrants III and IV. Teal rays reach both intersections. A blue clockwise arc marks the negative principal inverse-sine output at the Quadrant IV ray. No final solution angles are printed.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#075ea8"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c45a0a"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round"><line x1="95" y1="235" x2="505" y2="235" stroke="#cbd5e1" stroke-width="2" /><line x1="300" y1="30" x2="300" y2="440" stroke="#cbd5e1" stroke-width="2" /><text x="495" y="223" fill="#526579" font-size="22" >x</text><text x="312" y="42" fill="#526579" font-size="22" >y</text><line x1="300" y1="235" x2="488.6" y2="235" stroke="#075ea8" stroke-width="4" /><circle id="unit-circle" cx="300" cy="235" r="167" fill="none" stroke="#cbd5e1" stroke-width="2"/><line x1="65" y1="376.616" x2="555" y2="376.616" stroke="#b42318" stroke-width="3" id="sine-line" data-value="-0.848" stroke-dasharray="7 6"/><line x1="300" y1="235" x2="211.4906" y2="376.616" stroke="#087f8c" stroke-width="5" id="root-left"/><line x1="300" y1="235" x2="388.5094" y2="376.616" stroke="#087f8c" stroke-width="5" id="root-right"/><circle cx="211.4906" cy="376.616" r="6" fill="#087f8c"/><circle cx="388.5094" cy="376.616" r="6" fill="#087f8c"/><polyline id="principal" data-start="0" data-end="-57.99480013869697" points="378,235 377.9001,238.9459 377.6008,242.8817 377.1027,246.7973 376.4072,250.6827 375.516,254.5279 374.4314,258.3232 373.1562,262.0587 371.6937,265.7249 370.0476,269.3124 368.2221,272.8121 366.2218,276.2149 364.0521,279.5122 361.7182,282.6955 359.2264,285.7566 356.5829,288.6878 353.7944,291.4815 350.8682,294.1306 347.8118,296.6282 344.6329,298.968 341.3397,301.144" fill="none" stroke="#075ea8" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="45" y="358.616" fill="#b42318" font-size="24" >y = −0.848</text><text x="76" y="445" fill="#087f8c" font-size="24" >QIII solution</text><text x="382" y="445" fill="#087f8c" font-size="24" >QIV solution</text><text x="58" y="505" fill="#163a5f" font-size="24" >One horizontal line. Two terminal points.</text></g></svg>
