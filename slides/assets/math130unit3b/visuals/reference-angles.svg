<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Reference angles in the four quadrants</title><desc id="desc">Four small sets of axes, one per quadrant. In each, a teal terminal side makes an angle theta from the positive x-axis, and an orange arc marks the reference angle theta prime, measured to the nearest part of the x-axis. Quadrant I: theta prime equals theta. Quadrant II: 180 degrees minus theta. Quadrant III: theta minus 180 degrees. Quadrant IV: 360 degrees minus theta.</desc>
