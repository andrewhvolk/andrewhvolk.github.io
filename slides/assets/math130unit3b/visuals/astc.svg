<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" role="img" aria-labelledby="title desc">
<title id="title">Signs of the trigonometric functions by quadrant</title><desc id="desc">Coordinate axes with the four quadrants. Quadrant I: all functions positive, x and y positive. Quadrant II: sine and cosecant positive, x negative and y positive. Quadrant III: tangent and cotangent positive, x and y negative. Quadrant IV: cosine and secant positive, x positive and y negative. A note says sine is y over r, cosine is x over r, tangent is y over x, and r is always positive.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><line x1="150" y1="270" x2="610" y2="270" stroke="#526579" stroke-width="3" /><line x1="380" y1="40" x2="380" y2="500" stroke="#526579" stroke-width="3" /><text x="500" y="130" fill="#cbd5e1" font-size="40" text-anchor="middle" font-weight="700">I</text><text x="500" y="170" fill="#087f8c" font-size="30" text-anchor="middle" font-weight="700">All positive</text><text x="500" y="206" fill="#526579" font-size="24" text-anchor="middle" >x > 0, y > 0</text><text x="260" y="130" fill="#cbd5e1" font-size="40" text-anchor="middle" font-weight="700">II</text><text x="260" y="170" fill="#c45a0a" font-size="30" text-anchor="middle" font-weight="700">sin and csc</text><text x="260" y="206" fill="#526579" font-size="24" text-anchor="middle" >x &lt; 0, y > 0</text><text x="260" y="350" fill="#cbd5e1" font-size="40" text-anchor="middle" font-weight="700">III</text><text x="260" y="390" fill="#6d3bb5" font-size="30" text-anchor="middle" font-weight="700">tan and cot</text><text x="260" y="426" fill="#526579" font-size="24" text-anchor="middle" >x &lt; 0, y &lt; 0</text><text x="500" y="350" fill="#cbd5e1" font-size="40" text-anchor="middle" font-weight="700">IV</text><text x="500" y="390" fill="#075ea8" font-size="30" text-anchor="middle" font-weight="700">cos and sec</text><text x="500" y="426" fill="#526579" font-size="24" text-anchor="middle" >x > 0, y &lt; 0</text><text x="380" y="525" fill="#163a5f" font-size="24" text-anchor="middle" >sin = y/r, cos = x/r, tan = y/x, and r is always positive</text></g>
</svg>
