<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 510" role="img" aria-labelledby="title desc"><title id="title">A terminal point and signed coordinates</title><desc id="desc">An equal-scale coordinate diagram plots P=(-3,4). The horizontal directed coordinate is -3, the vertical directed coordinate is 4, and the radial length is labeled r without revealing its value. The blue angle is measured counterclockwise from positive x.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#075ea8"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c45a0a"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round"><line x1="90" y1="245" x2="480" y2="245" stroke="#cbd5e1" stroke-width="2" /><line x1="285" y1="50" x2="285" y2="440" stroke="#cbd5e1" stroke-width="2" /><text x="470" y="233" fill="#526579" font-size="22" >x</text><text x="297" y="62" fill="#526579" font-size="22" >y</text><line x1="285" y1="245" x2="464.4" y2="245" stroke="#075ea8" stroke-width="4" /><polygon id="triangle" data-x="-3" data-y="4" data-scale="32" points="285,245 189,245 189,117" fill="#e4f4f5"/><line x1="285" y1="245" x2="189" y2="117" stroke="#087f8c" stroke-width="5" id="terminal"/><line x1="189" y1="245" x2="189" y2="117" stroke="#c45a0a" stroke-width="3" stroke-dasharray="7 6"/><line x1="285" y1="245" x2="189" y2="245" stroke="#075ea8" stroke-width="4" /><circle cx="189" cy="117" r="6" fill="#087f8c"/><text x="171" y="102" fill="#087f8c" font-size="25" text-anchor="end">P = (-3, 4)</text><text x="237" y="279" fill="#075ea8" font-size="25" text-anchor="middle">x = -3</text><text x="171" y="187" fill="#c45a0a" font-size="25" text-anchor="end">y = 4</text><text x="262" y="166" fill="#087f8c" font-size="28" >r</text><polyline id="theta" data-start="0" data-end="1