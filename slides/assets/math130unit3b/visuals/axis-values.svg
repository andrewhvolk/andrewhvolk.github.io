<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 385" role="img" aria-labelledby="title desc"><title id="title">Zero denominators on the axes</title><desc id="desc">Two equal-scale unit circles show the point (0,1) at 90 degrees and the point (-1,0) at 180 degrees. At 90 degrees x is zero; at 180 degrees y is zero. No acute reference angle is drawn.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#075ea8"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c45a0a"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round"><line x1="45" y1="195" x2="265" y2="195" stroke="#cbd5e1" stroke-width="2" /><line x1="155" y1="85" x2="155" y2="305" stroke="#cbd5e1" stroke-width="2" /><text x="255" y="183" fill="#526579" font-size="22" >x</text><text x="167" y="97" fill="#526579" font-size="22" >y</text><line x1="155" y1="195" x2="256.2" y2="195" stroke="#075ea8" stroke-width="4" /><circle cx="155" cy="195" r="88" fill="none" stroke="#cbd5e1" stroke-width="2"/><line x1="155" y1="195" x2="155" y2="107" stroke="#087f8c" stroke-width="5" /><circle cx="155" cy="107" r="6" fill="#087f8c"/><text x="50" y="42" fill="#163a5f" font-size="26" font-weight="700">θ = 90°</text><text x="55" y="348" fill="#163a5f" font-size="24" >(x, y) = (0, 1)</text><line x1="355" y1="195" x2="575" y2="195" stroke="#cbd5e1" stroke-width="2" /><line x1="465" y1="85" x2="465" y2="305" stroke="#cbd5e1" stroke-width="2" /><text x="565" y="183" fill="#526579" font-size="22" >x</text><text x="477" y="97" fill="#526579" font-size="22" >y</text><line x1="465" y1="195" x2="566.2" y2="195" stroke="#075ea8" stroke-width="4" /><circle cx="465" cy="195" r="88" fill="none" stroke="#cbd5e1" stroke-width="2"/><line x1="465" y1="195" x2="377" y2="195" stroke="#087f8c" stroke-width="5" /><circle cx="377" cy="195" r="6" fill="#087f8c"/><text x="360" y="42" fill="#163a5f" font-size="26" font-weight="700">θ = 180°</text><text x="365" y="348" fill="#163a5f" font-size="24" >(x, y) = (−1, 0)</text></g></svg>
