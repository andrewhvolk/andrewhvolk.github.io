<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">A point on the terminal side</title><desc id="desc">Axes with the point P at negative 3, 4 in Quadrant II. A right triangle drops from P to the x-axis: horizontal leg x equals negative 3, vertical leg y equals 4, and the segment from the origin to P has length r equal to 5. The reference angle theta prime is between the terminal side and the negative x-axis.</desc>
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#163a5f"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#075ea8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f8c"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c45a0a"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d3bb5"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round"><line x1="120" y1="330" x2="710" y2="330" stroke="#526579" stroke-width="3" marker-end="url(#arrow-muted)"/><line x1="450" y1="450" x2="450" y2="30" stroke="#526579" stroke-width="3" marker-end="url(#arrow-muted)"/><polygon points="450,330 270,330 270,90" fill="#eaf3fb" stroke="#163a5f" stroke-width="4" stroke-linejoin="round"/><polyline points="288,330 288,312 270,312" fill="none" stroke="#163a5f" stroke-width="3"/><line x1="450" y1="330" x2="270" y2="90" stroke="#c45a0a" stroke-width="6" /><circle cx="270" cy="90" r="8" fill="#163a5f"/><text x="150" y="78" fill="#163a5f" font-size="28" >P(−3, 4)</text><text x="360" y="366" fill="#075ea8" font-size="26" text-anchor="middle" >x = −3</text><text x="184" y="218" fill="#087f8c" font-size="26" >y = 4</text><text x="378" y="204" fill="#c45a0a" font-size="28" >r = 5</text><polyline points="490,330 489.947,327.941 489.788,325.888 489.524,323.845 489.154,321.819 488.681,319.814 488.106,317.837 487.429,315.892 486.653,313.984 485.78,312.118 484.813,310.3 483.752,308.534 482.603,306.826 481.367,305.178 480.048,303.597 478.649,302.085 477.174,300.647 475.627,299.287 474.012,298.009 472.334,296.816 470.596,295.71 468.804,294.695 466.962,293.774 465.074,292.949 463.147,292.222 461.185,291.596 459.194,291.071 457.178,290.649 455.143,290.332 453.094,290.12 451.037,290.013 448.978,290.013 446.921,290.119 444.872,290.33 442.837,290.647 440.821,291.067 438.829,291.591 436.867,292.217 434.94,292.943 433.052,293.768 431.21,294.688 429.417,295.702 427.679,296.807 426,298" fill="none" stroke="#526579" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><polyline points="408,274 405.172,276.237 402.463,278.617 399.88,281.133 397.43,283.778 395.12,286.547 392.955,289.43 390.942,292.422 389.085,295.513 387.39,298.695 385.861,301.961 384.502,305.301 383.317,308.706 382.309,312.168 381.481,315.677 380.834,319.225 380.371,322.8 380.093,326.395 380,330" fill="none" stroke="#6d3bb5" stroke-width="5" stroke-linejoin="round" /><text x="318" y="316" fill="#6d3bb5" font-size="26" font-family="Georgia, 'Times New Roman', serif" font-style="italic">θ′</text><text x="40" y="400" fill="#163a5f" font-size="24" >r = √(x² + y²) = √(9 + 16) = 5</text></g>
</svg>
