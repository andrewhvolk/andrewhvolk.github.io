<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" role="img" aria-labelledby="title desc"><title id="title">The reference angle for 150 degrees</title><desc id="desc">Equal-scale axes show a 150 degree counterclockwise angle in Quadrant II. The orange acute reference angle is measured from the negative x-axis to the terminal side, not from the y-axis.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#075ea8"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c45a0a"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round"><line x1="100" y1="270" x2="480" y2="270" stroke="#cbd5e1" stroke-width="2" /><line x1="290" y1="80" x2="290" y2="460" stroke="#cbd5e1" stroke-width="2" /><text x="470" y="258" fill="#526579" font-size="22" >x</text><text x="302" y="92" fill="#526579" font-size="22" >y</text><line x1="290" y1="270" x2="464.8" y2="270" stroke="#075ea8" stroke-width="4" /><line x1="290" y1="270" x2="148.4914" y2="188.3" stroke="#087f8c" stroke-width="5" id="q2-ray" data-degrees="150"/><circle cx="148.4914" cy="188.3" r="6" fill="#087f8c"/><polyline id="q2-rotation" data-start="0" data-end="150" points="358.4,270 358.3063,266.4202 358.0253,262.8503 357.5579,259.2999 356.9053,255.7788 356.0693,252.2968 355.0523,248.8632 353.8569,245.4876 352.4865,242.1792 350.9448,238.947 349.2361,235.8 347.3651,232.7467 345.3368,229.7955 343.1568,226.9545 340.8311,224.2315 338.3661,221.6339 335.7685,219.1689 333.0455,216.8432 330.2045,214.6632 327.2533,212.6349 324.2,210.7639 321.053,209.0552 317.8208,207.5135 314.5124,206.1431 311.1368,204.9477 307.7032,203.9307 304.2212,203.0947 300.7001,202.4421 297.1497,201.9747 293.5798,201.6937 290,201.6 286.4202,201.6937 282.8503,201.9747 279.2999,202.4421 275.7788,203.0947 272.2968,203.9307 268.8