<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 510" role="img" aria-labelledby="title desc"><title id="title">Coordinate signs determine function signs</title><desc id="desc">A unit circle on equal-scale axes shows positive x and y in Quadrant I, negative x and positive y in II, negative x and y in III, and positive x and negative y in IV. Radius r is positive everywhere.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#075ea8"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c45a0a"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" stroke-linecap="round"><line x1="95" y1="260" x2="485" y2="260" stroke="#cbd5e1" stroke-width="2" /><line x1="290" y1="65" x2="290" y2="455" stroke="#cbd5e1" stroke-width="2" /><text x="475" y="248" fill="#526579" font-size="22" >x</text><text x="302" y="77" fill="#526579" font-size="22" >y</text><line x1="290" y1="260" x2="469.4" y2="260" stroke="#075ea8" stroke-width="4" /><circle cx="290" cy="260" r="155" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="375" y="156" fill="#163a5f" font-size="25" >x +, y +</text><text x="120" y="156" fill="#163a5f" font-size="25" >x −, y +</text><text x="120" y="367" fill="#163a5f" font-size="25" >x −, y −</text><text x="375" y="367" fill="#163a5f" font-size="25" >x +, y −</text><text x="60" y="480" fill="#526579" font-size="23" >r is a positive distance in every quadrant.</text></g></svg>
