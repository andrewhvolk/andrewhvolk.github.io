# MATH 130 course page data. The page at /courses/math130.html is built from this file.
#
# Same format as _data/math114.yml, plus "sessions": dated class-session decks, listed
# apart from the main unit slides (group names: handouts_label and sessions_label).
# Each row is one quiz cycle. A date can add
# "time" when it is not the usual 2:10 p.m. (shown after the date).
# Dates use the form YYYY-MM-DD. The page highlights the current row
# automatically: the first row whose last date is today or later.
# Schedule source: math130FallSchedule and math130CanvasDueDates in theme.js.

code: MATH 130
handouts_label: Main slides and notes
sessions_label: Class sessions
title: Advanced Technical Mathematics
term: Fall 2026
intro: "Everything for the course, by unit. Quizzes are on paper in class, and ALEKS work is due at 2:10 p.m. unless noted. Canvas and the syllabus are the official record for due dates and grades."
canvas: https://canvas.liberty.edu/

tools:
  - label: ALEKS (open it through Canvas)
    url: https://canvas.liberty.edu/
  - label: Desmos scientific calculator
    url: https://www.desmos.com/scientific
  - label: Desmos graphing calculator
    url: https://www.desmos.com/graphing
  - label: Why a later assignment can have more work
    url: /courses/why-homework-can-grow.html

extras: []

parts:
  - name: "Unit 1: Algebra, functions, and coordinate geometry"
    modules:
      - label: Chapter R
        title: Algebra foundations
        goals:
          - Write intervals and find their unions and intersections.
          - Simplify expressions with exponent rules, including rational exponents.
          - Factor polynomials and simplify rational expressions.
        lesson: /130Test1.html
        lesson_label: Open Unit 1
        dates:
          - { kind: ALEKS R.1–R.5 and Quiz 1, date: 2026-09-02 }
        handouts:
          - { label: "Unit 1A: Factor first", url: /slides/Math130Unit1A.html }
        sessions:
          - { label: "Aug 28: Factor first", url: /slides/Math130FactorFirst_2026-08-28.html }
          - { label: "Aug 31: Split the middle term and group", url: /slides/Math130CommonDenominators_2026-08-31.html }
          - { label: "Aug 31: Printable handout (PDF)", url: /pdfs/Math130CommonDenominators_2026-08-31_Handout.pdf }
          - { label: "Sep 2: Review and Quiz 1", url: /slides/Math130Quiz1Review_2026-09-02.html }
        videos:
          - { label: Intersection and union of two intervals, url: "https://www.youtube.com/watch?v=lsvjiAsBZUM" }
          - { label: Intersection and union of discrete sets, url: "https://www.youtube.com/watch?v=fezDDJij25U" }
          - { label: Challenging absolute value equations, url: "https://youtube.com/shorts/alBGenaCn40" }
          - { label: Rational exponents, url: "https://youtu.be/o2B0IohGKNI" }
          - { label: Factoring a quadratic with lead coefficient 1, url: "https://youtu.be/-CyiqgtA2_U" }
          - { label: Factoring a quadratic with a lead coefficient, url: "https://youtu.be/5aPaldvXCmw" }
          - { label: Solving quadratics by factoring, url: "https://youtu.be/7GQvKh6Tmgk" }

      - label: Sections 1.1–1.4
        title: Equations with fractions, roots, and quadratics
        goals:
          - Solve equations with fractions and check for excluded values.
          - Rearrange a formula to solve for a named variable.
          - Solve quadratic equations by factoring, completing the square, or the quadratic formula.
        lesson: /130Test1.html
        lesson_label: Open Unit 1
        dates:
          - { kind: "ALEKS R.6, 1.1/1.2/1.4 and Quiz 2", date: 2026-09-09 }
        handouts:
          - { label: "Unit 1D: Quadratic equations and applications", url: /slides/Math130Unit1D.html }
        sessions:
          - { label: "Sep 4: Equations with fractions and roots", url: /slides/Math130LinearEquations_2026-09-04.html }
          - { label: "Sep 7: Quiz 2 review (PDF)", url: /slides/Math130Quiz2Review_2026-09-07_typeset.pdf }
        videos:
          - { label: Solving rational equations, url: "https://youtu.be/LH40X-gPLOw" }

      - label: Sections 2.1–2.4
        title: Lines, functions, and coordinate geometry
        goals:
          - Find the distance and midpoint between two points.
          - Write the equation of a circle from its center and radius.
          - Write equations of lines, including parallel and perpendicular lines.
        lesson: /130Test1.html
        lesson_label: Open Unit 1
        dates:
          - { kind: ALEKS 2.1/2.2/2.4 and Quiz 3, date: 2026-09-16 }
        handouts:
          - { label: "Unit 1B: Linear equations and lines", url: /slides/Math130Unit1B.html }
          - { label: "Unit 1C: Functions and coordinate geometry", url: /slides/Math130Unit1C.html }
        sessions:
          - { label: "Sep 11: Coordinate geometry (PDF)", url: /slides/Math130CoordinateGeometry_2026-09-11.pdf }
          - { label: "Sep 14: Quiz 3 review (PDF)", url: /slides/Math130Quiz3Review_2026-09-14-v4.pdf }
          - { label: "Sep 16: Quiz 3 and aviation lines (PDF)", url: /slides/Math130Quiz3Day_2026-09-16-v4.pdf }
        videos:
          - { label: Midpoint and distance formulas, url: "https://www.youtube.com/watch?v=dxskClJTbPQ" }
          - { label: Standard equation of a circle, url: "https://youtu.be/golqytjtN-c" }
          - { label: Slope-intercept vs. point-slope form, url: "https://www.youtube.com/watch?v=4umbDjZ2R1I" }
          - { label: Slopes of parallel and perpendicular lines, url: "https://www.youtube.com/watch?v=acsR7w0I__w" }
          - { label: Finding the vertex of a parabola, url: "https://www.youtube.com/watch?v=ygH-Y5YG5kE" }

      - label: Test 1
        title: Test 1 review
        goals:
          - Choose a method for mixed problems from Chapter R through Section 2.5.
          - Find the maximum height of a projectile from a quadratic model.
          - Write each Unit 1 formula from memory, since none are provided on the test.
        review: true
        lesson: /130Test1.html
        dates:
          - { kind: ALEKS 2.5/3.1, date: 2026-09-23 }
          - { kind: Quiz 4 (take-home), date: 2026-09-23, time: "3:15 p.m." }
          - { kind: Test 1 (in class), date: 2026-09-25 }
        handouts:
          - { label: "Unit 1E: Test 1 mixed retrieval", url: /slides/Math130Unit1E.html }
        sessions:
          - { label: "Sep 18: Lines review (PDF)", url: /slides/Math130LinesReview_2026-09-18-v3.pdf }
          - { label: "Sep 23: Test 1 review lecture (PDF)", url: /slides/Math130Test1Review_2026-09-23.pdf }
        practice:
          - { label: Printable practice handout (PDF), url: /pdfs/130Test1ReviewPractice.pdf }

  - name: "Unit 2: Interest, logarithms, polygons, and circles"
    modules:
      - label: Section 4.2
        title: Exponential functions and interest
        goals:
          - Evaluate and graph exponential functions.
          - Compute simple, compound, and continuously compounded interest.
        lesson: /130Test2.html
        lesson_label: Open Unit 2
        dates:
          - { kind: Quiz 5, date: 2026-09-30 }
          - { kind: ALEKS 4.2, date: 2026-10-02 }
        handouts:
          - { label: "Unit 2A: Exponential functions", url: /slides/Math130Unit2A.html }
          - { label: Unit 2A (PDF), url: /slides/Math130Unit2A.pdf }
        videos:
          - { label: Graphing and tables, url: "https://www.youtube.com/watch?v=kikGvjKFN8Q" }
          - { label: "Calculator: decimal exponents", url: "https://www.youtube.com/watch?v=aix8TLHdKgc" }
          - { label: Simple vs. compound interest, url: "https://www.youtube.com/watch?v=NCYNXkbTTUo" }
          - { label: Continuous compounding, url: "https://www.youtube.com/watch?v=2S4vK30dII0" }

      - label: Section 4.3
        title: Logarithmic functions
        goals:
          - Convert between logarithmic and exponential form.
          - Evaluate logarithms, including with the change-of-base formula.
          - Solve exponential equations using logarithms.
        lesson: /130Test2.html
        lesson_label: Open Unit 2
        dates:
          - { kind: ALEKS 4.3 and Quiz 6, date: 2026-10-07 }
        handouts:
          - { label: "Unit 2B: Logarithmic functions", url: /slides/Math130Unit2B.html }
          - { label: Unit 2B (PDF), url: /slides/Math130Unit2B.pdf }
        sessions:
          - { label: "Oct 2: From exponentials to logarithms", url: /slides/Math130ExponentialsToLogs_2026-10-02.html }
          - { label: "Oct 2: Guided notes", url: /slides/handouts/math130-exp-log-notes-2026-10-02.html }
          - { label: "Oct 2: Notes (PDF)", url: /pdfs/130ExpLogNotes_2026-10-02.pdf }
        videos:
          - { label: Converting between logs and exponentials, url: "https://www.youtube.com/watch?v=-ZQvz4bc2Eg" }
          - { label: Evaluating log expressions, url: "https://www.youtube.com/watch?v=eL2FhO11mf0" }
          - { label: Change of base, url: "https://www.youtube.com/watch?v=3Rf8KEhY0ts" }
          - { label: Solving exponential equations with logs, url: "https://www.youtube.com/watch?v=fnhFneOz6n8" }

      - label: Geometry, part 1
        title: Angles and polygons
        goals:
          - Use angle relationships, including parallel lines, to find unknown angles.
          - Find the angle sums and areas of polygons.
          - Solve proportions with similar triangles.
        lesson: /130Test2.html
        lesson_label: Open Unit 2
        dates:
          - { kind: Quiz 7, date: 2026-10-14 }
        handouts:
          - { label: "Unit 2C: Angles and polygons", url: /slides/Math130Unit2C.html }
          - { label: Unit 2C (PDF), url: /slides/Math130Unit2C.pdf }
        videos:
          - { label: Piecewise rectangular areas, url: "https://www.youtube.com/watch?v=8ysZhPknfYY" }

      - label: Geometry, part 2
        title: Circles, radians, and solids
        goals:
          - Convert between degrees, radians, and degrees-minutes-seconds.
          - Find arc length, sector area, and linear and angular speed.
          - Find the volume and surface area of a cylinder.
        lesson: /130Test2.html
        lesson_label: Open Unit 2
        dates:
          - { kind: Quiz 8, date: 2026-10-21 }
        handouts:
          - { label: "Unit 2D: Circles, radians, velocity, and solids", url: /slides/Math130Unit2D.html }
          - { label: Unit 2D (PDF), url: /slides/Math130Unit2D.pdf }
        sessions:
          - { label: "Oct 19: Circle, radian, and speed review", url: /slides/math130-quiz8-readiness-2026-10-19.html }
          - { label: "Oct 19: Readiness practice (PDF)", url: /pdfs/math130-quiz8-readiness-practice-2026-10-19.pdf }
          - { label: "Oct 21: Cylinder volume and surface area", url: /slides/math130-solids-after-quiz8-2026-10-21.html }
          - { label: "Oct 23: Circles worksheet (PDF)", url: /pdfs/math130-circles-worksheet-practice-2026-10-23.pdf }
          - { label: "Oct 26: Linear and angular velocity (PDF)", url: /pdfs/math130-velocity-slides-2026-10-26.pdf }
        videos:
          - { label: DMS to decimal degrees, url: "https://www.youtube.com/watch?v=FcDyaiHO4GQ" }
          - { label: Radians and degrees, url: "https://www.youtube.com/watch?v=JmLN3QxshlE" }
          - { label: Circle sectors and arc length, url: "https://www.youtube.com/watch?v=XUus6-9E9sQ" }
        practice:
          - { label: Quiz 8 practice (PDF), url: /pdfs/130Quiz8Practice.pdf }
          - { label: "Quiz 8 practice: decimal degrees to DMS", url: "/130Test2.html#tab-practice" }

      - label: Test 2
        title: Test 2 review
        goals:
          - Choose a method for mixed exponential, logarithm, and geometry problems.
          - Correct each missed problem and explain the error.
        review: true
        lesson: /130Test2.html
        dates:
          - { kind: Quiz 9 (circles), date: 2026-10-28 }
          - { kind: ALEKS geometry and Test 2, date: 2026-10-30 }
        handouts:
          - { label: "Unit 2E: Test 2 review", url: /slides/Math130Unit2E.html }
          - { label: Unit 2E (PDF), url: /slides/Math130Unit2E.pdf }
        practice:
          - { label: Printable Test 2 practice (PDF), url: /pdfs/math130-test2-practice-2026-10-26.pdf }
          - { label: "Quiz 9 practice: circles (PDF)", url: /pdfs/math130-quiz9-practice-2026-10-28.pdf }

  - name: "Unit 3: Trigonometry, applications, and vectors"
    modules:
      - label: Sections 5.1–5.3
        title: Angles and trigonometric functions
        goals:
          - Sketch angles in standard position and find coterminal angles.
          - Find sine, cosine, and tangent ratios in a right triangle.
          - Use reference angles and quadrant signs to evaluate trigonometric functions.
        lesson: /130Test3.html
        lesson_label: Open Unit 3
        dates:
          - { kind: ALEKS 5.1/5.2 and Quiz 10, date: 2026-11-11 }
        handouts:
          - { label: "Unit 3A: Angles and right triangle trigonometry", url: /slides/Math130Unit3A.html }
          - { label: Unit 3A (PDF), url: /slides/Math130Unit3A.pdf }
          - { label: "Unit 3B: Trigonometric functions of any angle", url: /slides/Math130Unit3B.html }
          - { label: Unit 3B (PDF), url: /slides/Math130Unit3B.pdf }
          - { label: "Section 5.3 notes (printable)", url: /130Q10.html }
        practice:
          - { label: "Section 5.3 practice, for Quiz 10", url: /130quiz10.html }

      - label: Sections 5.3 and 5.7
        title: Right triangle applications
        goals:
          - Find a missing side or angle of a right triangle with a trigonometric ratio.
          - Solve word problems with angles of elevation and depression.
        lesson: /130Test3.html
        lesson_label: Open Unit 3
        dates:
          - { kind: ALEKS 5.3/5.7 and Quiz 11, date: 2026-11-18 }
        handouts:
          - { label: "Unit 3C: Right triangle applications", url: /slides/Math130Unit3C.html }
          - { label: Unit 3C (PDF), url: /slides/Math130Unit3C.pdf }

      - label: Sections 7.1 and 8.4
        title: Applications and vectors
        goals:
          - Solve right triangles and bearing problems.
          - Write vectors in component form, then add and scale them.
          - Find a vector's magnitude and direction angle.
        lesson: /130Test3.html
        lesson_label: Open Unit 3
        dates:
          - { kind: ALEKS 7.1, date: 2026-11-30 }
          - { kind: ALEKS 8.4 and Quiz 12, date: 2026-12-02 }
        handouts:
          - { label: "Unit 3D: Vectors", url: /slides/Math130Unit3D.html }
          - { label: Unit 3D (PDF), url: /slides/Math130Unit3D.pdf }
          - { label: Vector review deck, url: /vectorgap.html }
          - { label: Vector review guided notes, url: /vectorgapnotes.html }
        practice:
          - { label: "Section 7.1 review game (Skyhawk)", url: /SkyhawkTrig.html }
          - { label: "Vector lesson and worksheet", url: /vectorws.html }

      - label: Test 3
        title: Test 3 review
        goals:
          - Choose a method for mixed trigonometry, application, and vector problems.
          - Use Quiz 13 to find and fix weak areas before Test 3.
        review: true
        lesson: /130Test3.html
        dates:
          - { kind: Quiz 13 (readiness check), date: 2026-12-07 }
          - { kind: Test 3, date: 2026-12-09 }
        handouts:
          - { label: "Unit 3E: Test 3 review", url: /slides/Math130Unit3E.html }
          - { label: Unit 3E (PDF), url: /slides/Math130Unit3E.pdf }
        practice:
          - { label: Unit 3 practice questions, url: /Unit3Practice.html }

  - name: Final exam
    modules:
      - label: Final
        title: Final exam review
        goals:
          - Recall the formulas and problem types from all three units.
          - Work mixed final exam practice under time limits.
        review: true
        lesson: /130Test4.html
        dates:
          - { kind: Final exam, date: 2026-12-14, time: "1:00 p.m." }
        practice:
          - { label: Final exam practice lab, url: /130Test4.html }
          - { label: Guided final review, url: /math130_final_lecture.html }
