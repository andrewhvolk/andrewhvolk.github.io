# MATH 130 course page data. The page at /courses/math130.html is built from this file.
#
# Same format as _data/math114.yml. Each row is one quiz cycle. A date can add
# "time" when it is not the usual 2:10 p.m. (shown after the date).
# Dates use the form YYYY-MM-DD. The page highlights the current row
# automatically: the first row whose last date is today or later.
# Schedule source: math130FallSchedule and math130CanvasDueDates in theme.js.

