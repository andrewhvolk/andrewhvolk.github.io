# Text for the Math Club page (club/index.html). Edit here; the page updates on the next build.
# The page shows no event dates: events are announced by email.
intro: >-
  Math Club is open to every Liberty student who enjoys mathematics, in any major.
  Members solve problems together, compete, do research, and prepare for graduate
  school and careers.

# Each id is also a link target, for example /club/#research.
teams:
  - id: research
    name: Research team
    text: Small groups work on one project with a faculty mentor and present it as a poster, paper, or talk.
  - id: competition
    name: Competition team
    text: Students take the Putnam exam in the fall and compete in the Integration Bee in the spring. No competition experience is needed.
  - id: interdisciplinary
    name: Interdisciplinary team
    text: Students apply data analysis, statistics, and modeling to questions from other departments. Faculty with a project idea can email the advisor.

honor_societies:
  - id: kme
    name: Kappa Mu Epsilon
    text: Liberty's Virginia Iota chapter, active since 1989. New members are inducted each fall.
  - id: pme
    name: Pi Mu Epsilon
    text: The national mathematics honor society. New members are inducted each spring.

eligibility: >-
  Invitations generally consider completed calculus courses, mathematics GPA, and overall GPA.
