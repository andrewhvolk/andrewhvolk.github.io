# Physics Lab 1 (PHYS 201L / 231L) course page data. Built into /courses/physlab1.html.
#
# Same format as _data/math114.yml. Each row is one lab: its prelab quiz and report.
# A row with no handouts, videos, practice, or lesson shows as a plain row.
# Dates use the form YYYY-MM-DD. Source: Canvas assignments, PHYS231L_004 / PHYS201L_004, Fall 2026.
# Sections 004 and 005 both meet on Tuesdays, so the dates are shared; only the start time differs.

code: PHYS 201L / 231L
title: Physics Lab 1
term: Fall 2026
intro: "Sections 004 and 005 meet Tuesdays, at 8:00 a.m. and 11:00 a.m. Each prelab quiz is due in Canvas when your lab starts, and the lab report is due the next day at 4:00 p.m. Canvas and the syllabus are the official record for due dates and grades."
canvas: https://canvas.liberty.edu/

checklist_title: Before lab
checklist:
  - Finish the prelab quiz in Canvas before your lab starts.
  - Read the experiment in your lab manual, and bring the printed manual to lab.
  - Write down the expected quantities, units, and formulas before you collect data.
  - Bring a calculator, and ask before using unfamiliar equipment.

tools:
  - label: Desmos graphing calculator
    url: https://www.desmos.com/graphing
  - label: Excel Online
    url: https://www.microsoft365.com/launch/excel

extras: []

