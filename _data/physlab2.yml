# A row with no handouts, videos, practice, or lesson shows as a plain row.
# Dates use the form YYYY-MM-DD. Source: Canvas assignments, PHYS232L_006 / PHYS202L_006, Fall 2026.

code: PHYS 202L / 232L
title: Physics Lab 2
term: Fall 2026
intro: "Section 006 meets Thursdays at 8:00 a.m. Each prelab quiz is due in Canvas when lab starts, and the lab report is due the next day at 4:00 p.m. Canvas and the syllabus are the official record for due dates and grades."
canvas: https://canvas.liberty.edu/

checklist_title: Before lab
checklist:
  - Finish the prelab quiz in Canvas before lab starts.
  - Read the experiment in your lab manual, and bring the printed manual to lab.
  - Bring a calculator.
  - Ask before changing a circuit, a magnet setup, or an optical path.

